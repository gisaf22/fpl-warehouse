name: fpl_warehouse
version: 0.1.0
config-version: 2

profile: fpl_warehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Root of fpl-ingest's raw capture tree. Defaults to the S3 bucket; override
  # with `--vars '{raw_root: .local/raw}'` to build against a local capture
  # when no AWS session is available.
  #
  # This var is the *live* root only. The `fixtures` target does not go through
  # it — models.staging.sources.yml switches on the target name and reads the
  # checked-in tree under tests/fixtures/raw instead, so `--target fixtures` is
  # a complete invocation and cannot be paired with the wrong root. See the
  # comment on `external_location` there, and tests/fixtures/build_fixtures.py
  # for what that tree covers.
  raw_root: "s3://fpl-data-safari/raw"

  # Season label stamped onto the served grain. fpl-ingest's raw key layout has
  # no season segment yet, so every raw object belongs to the current season and
  # this constant is the only available source of the value. When fpl-ingest
  # adds a season segment, this var is replaced by a parsed column — the grain
  # itself does not change.
  season: "2026-27"

  # Pre-deadline capture window, for the missed-deadline warning (#111). A
  # deadline counts as covered when an admitted capture's observed_at falls in
  # [deadline - (gate + buffer) minutes, deadline).
  #
  # pre_deadline_gate_minutes mirrors fpl-ingest's PRE_DEADLINE_WINDOW in
  # orchestration/pre_deadline.py, widened from 75 to 120 in
  # gisaf22/fpl-ingest@7daf43e (2026-10-04). If the gate changes again, change
  # this with it. The buffer covers received_at landing just before the gate
  # reads its clock (#80's 5 minutes, kept).
  pre_deadline_gate_minutes: 120
  pre_deadline_buffer_minutes: 5
  # stg_run.trigger and the pre-deadline workflow both start on 2026-09-24, so
  # no earlier deadline had a capture to miss (#80). Delete, do not re-date.
  pre_deadline_coverage_start: "2026-09-24"

  # Root of the re-keyed history tree — closed seasons ported from the pre-S3
  # archive by scripts/rekey_history_season.py, laid out as
  # {history_root}/{season}/fpl/{endpoint}/{extraction_date}/{run_id}/payload.json.
  #
  # Empty means "no history tree": the sources then glob the live root only,
  # which is what keeps a build working before the tree exists. It is
  # deliberately NOT under raw_root — see the script's docstring for the two
  # reasons (the live globs would read it as this season, and fpl-ingest treats
  # any object under an endpoint prefix as "already captured").
  #
  # The `fixtures` target ignores this var, as it ignores raw_root, and reads
  # the checked-in tree under tests/fixtures/history instead.
  history_root: ""

  # Seasons that are over and fully settled. Every fct_player_fixture row of a
  # closed season reads is_ratified = true: event-status only ever serves the
  # current gameweek, so there is no per-gameweek verdict to read for them. The claim
  # is checked against each closed season's own calendar by
  # tests/fct_test_player_fixture_closed_season_settled.sql, which also fails if
  # the live `season` above is ever listed here.
  closed_seasons: ["2025-26"]

  # Version of the served contract, published as `contract_version` in
  # served/_manifest.json by scripts/publish_served.py (#74). Bump it by one in
  # the same pull request as any breaking change to a served model: a column
  # dropped, renamed, retyped or moved; a served table removed; a grain or key
  # change; or a change to what an existing column's values mean. Appending a
  # column last, serving a new table or adding a manifest field is not breaking.
  # The publish refuses a shape break at the same version, but cannot see a
  # change in meaning — that bump is caught by review only.
  served_contract_version: 1

models:
  fpl_warehouse:
    staging:
      # Table, not view: staging reads ~25k S3 objects and a view makes every
      # downstream node (fact, then each test) repeat that read, which blew past
      # the exported credential's lifetime with ExpiredToken. As a table the raw
      # tree is read once.
      +materialized: table
    intermediate:
      +materialized: view
    marts:
      # Served models are materialized so consumers read them without
      # re-reading the raw tree, and so the dedup window function runs once.
      +materialized: table
