[project]
name = "fpl-warehouse"
version = "0.1.0"
description = "Transforms fpl-ingest's raw S3 JSON into served fact and aggregate tables via dbt-duckdb."
authors = [
    { name = "gisaf22", email = "safari.gisa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.9",
    # Publishing the served parquet to S3 (scripts/publish_served.py). DuckDB's
    # httpfs could write s3:// directly, but the upload mechanism in this
    # account is already boto3 in fpl-ingest's S3Backend; one S3 write path
    # across both repos is worth the dependency. duckdb still does the local
    # parquet export.
    "boto3>=1.34",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.10",
    "vulture>=2.16",
]

# Python tests for scripts/ live in scripts/tests/, never in tests/: tests/ is
# dbt's test-paths (singular .sql tests and tests/fixtures/), so testpaths keeps
# pytest out of it. scripts/tests/conftest.py enforces tracing and tiering at
# collection — see CLAUDE.md, "Tests".
[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
strict_markers = true
markers = [
    # Tiers — exactly one per test, declared on the test like a dbt tier tag.
    "unit: a single function or module in isolation — no S3, no built warehouse",
    "integration: several components wired together, still with no S3",
    # Traceability — at least one per test.
    'covers: the acceptance criterion a test proves — covers("#<issue> AC<n>"); repeat for several',
]
