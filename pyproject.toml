[project]
name = "fpl-warehouse"
version = "0.1.0"
description = "Transforms fpl-ingest's raw S3 JSON into served fact and aggregate tables via dbt-duckdb."
authors = [
    { name = "gisaf22", email = "safari.gisa@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "dbt-duckdb>=1.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.15.10",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = [
    "unit: pure unit tests — in-memory fixtures, no DB, no network",
    "integration: tests against real master.db — skip if DB not found",
    "smoke: end-to-end tests with real API — requires TEAM_ID env var",
]
