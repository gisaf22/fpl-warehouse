[project]
name = "fpl-warehouse"
version = "0.1.0"
description = "Transforms fpl-ingest's raw S3 JSON into served fact and aggregate tables via dbt-duckdb."
authors = [
    { name = "gisaf22", email = "safari.gisa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.9",
    # Publishing the served parquet to S3 (scripts/publish_served.py). DuckDB's
    # httpfs could write s3:// directly, but the upload mechanism in this
    # account is already boto3 in fpl-ingest's S3Backend; one S3 write path
    # across both repos is worth the dependency. duckdb still does the local
    # parquet export.
    "boto3>=1.34",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "vulture>=2.16",
]

# No pytest config: this project has no Python source and no Python tests. The
# whole suite is dbt tests under `tests/`, tiered by tag — see CLAUDE.md,
# "Tests". The pre-migration pytest suite tested `fpl_warehouse.*`, deleted in
# Phase 1.
