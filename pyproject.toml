[project]
name = "fpl-warehouse"
version = "0.1.0"
description = "Merges FPL and Understat ingestion databases into a unified warehouse."
authors = [
    { name = "gisaf22", email = "safari.gisa@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "rapidfuzz>=3.0",
    "requests>=2.28",
]

[project.scripts]
fpl-warehouse = "fpl_warehouse.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.15.10",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = [
    "unit: pure unit tests — in-memory fixtures, no DB, no network",
    "integration: tests against real master.db — skip if DB not found",
    "smoke: end-to-end tests with real API — requires TEAM_ID env var",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
