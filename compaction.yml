# Element-summary compaction (#198, #205). The one place both values live; read
# by scripts/compaction_step.py and compaction_metrics.py. See docs/compacted.md.

# Time budget per scheduled compaction run, in seconds (#78 W16, replacing
# W14's day count). Days are compacted oldest first; no new day starts once the
# elapsed time reaches this, and a started day always runs to completion, so a
# run can overrun it by one day. 0 ships compaction disabled: the step makes no
# S3 call. #200 sets it (W16 proposes 1,800s) from the compaction_dry_run
# figures: dry run 38828339698's heaviest day took 1,084.4s, and the budget
# plus that day must stay under scheduled_compaction.yml's 50-minute
# timeout-minutes. Rollback: set it to 0.
max_seconds_per_run: 0

# Day D closes at D+1 00:00 UTC plus this, once every run manifest under
# raw/fpl/_manifests/D/ is finalized (#198 D1). 6h until fpl-ingest#99 sets the
# ingest job's own timeout-minutes; then set it to that.
ingest_job_timeout_hours: 6
