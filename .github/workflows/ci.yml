name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      duckdb_threads:
        description: >-
          DuckDB thread count for the live build. Default 32 matches
          profiles.yml, so an ordinary dispatch is unchanged. Raise it only to
          measure scaling — see CLAUDE.md, "S3 credentials for local dbt runs".
        required: false
        default: "32"
      history_root:
        description: >-
          Root of the ported history tree for the live build, e.g.
          s3://fpl-data-safari/history. Empty (the default) globs the live root
          only, which is the normal case and is proven a no-op. Setting it
          makes the live build multi-season — the CI role must hold
          s3:GetObject on that prefix, or every history payload GET 403s while
          the glob still expands. See dbt_project.yml, `history_root`.
        required: false
        default: ""

jobs:
  # Required check. Everything here runs without credentials, because nothing
  # here executes a model — `dbt parse` builds the manifest and stops.
  #
  # That is not a formality in this project. The access boundary is enforced at
  # parse time: the `warehouse_internal` group and the `access: private`
  # modifiers on staging and intermediate models are resolved here, so a model
  # or singular test that reads staging without declaring group membership
  # fails in this job rather than in review. Every ref() and the contract
  # declarations are resolved here too.
  #
  # What this job does NOT check is the contracts themselves. dbt compares a
  # served model's real columns against its declared ones when the model is
  # built, so a contract violation surfaces in `fixture-tests`, not here.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # packages.yml (audit_helper, for the served diff) must be installed
      # before dbt will parse the project.
      - name: Install dbt packages
        run: uv run dbt deps

      # Resolves every ref() and the group/access boundary. No warehouse
      # connection, so no AWS session needed.
      - name: Parse project
        run: uv run dbt parse

      # Keeps the tier taxonomy honest as tests are added: a test with no tier
      # tag runs in no tier and is silently never enforced, and one with two
      # tiers runs in both. Neither is visible without this check.
      #
      # dbt unit tests (`unit_tests:`) are a separate resource type from data
      # tests, so both are listed. They also report their tags only under
      # `config.tags` — the top-level `tags` key is absent from their `dbt ls`
      # output — so tags are read from both places.
      - name: Check every test carries exactly one tier tag
        run: |
          uv run dbt ls --resource-type test --resource-type unit_test \
            --output json --output-keys name tags config \
            > /tmp/tests.json
          uv run python - <<'PY'
          import json, sys

          TIERS = {"unit", "integration", "e2e"}
          bad = []
          counts = {t: 0 for t in TIERS}
          seen = 0
          with open("/tmp/tests.json") as fh:
              for line in fh:
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  node = json.loads(line)
                  seen += 1
                  tags = set(node.get("tags") or []) | set(
                      (node.get("config") or {}).get("tags") or [])
                  tiers = TIERS & tags
                  if len(tiers) != 1:
                      bad.append((node["name"], sorted(tiers) or "none"))
                  for t in tiers:
                      counts[t] += 1

          # Without this the check passes vacuously on an empty listing, and a
          # green result would mean "found nothing to complain about" rather
          # than "verified every test".
          if seen == 0:
              print("::error::no test nodes found — dbt ls returned nothing, so "
                    "this check verified nothing")
              sys.exit(1)

          for name, tiers in bad:
              print(f"::error::{name} has tier tags {tiers}; expected exactly one "
                    f"of unit / integration / e2e")

          # Printed on success too, so the log shows what was actually checked
          # rather than leaving a silent green.
          print(f"{seen} test nodes: "
                + ", ".join(f"{t}={counts[t]}" for t in sorted(counts))
                + (f", untiered or multi-tiered={len(bad)}" if bad
                   else " — every one with exactly one tier tag"))
          sys.exit(1 if bad else 0)
          PY

      # The served boundary, checked from what dbt resolved rather than read
      # off schema.yml (#44 AC3). Exactly the served models are public, so a
      # model outside warehouse_internal can ref() them and a served model
      # that slips back to private fails here. Every staging and intermediate
      # model is private, so none of them can be ref()'d from outside the
      # group; dbt enforces that at parse, and this pins that none was
      # quietly made public. Add a model to SERVED only when it is published.
      # E8 of #88 (#104 AC2): capture metadata comes from the capture index,
      # never from an object's path. So no model or singular test may name the
      # `filename` column DuckDB reports. The one place a path becomes an index
      # key is macros/capture_key_from_filename.sql, which this step does not
      # scan, and sources.yml's `filename = true` is not a .sql file.
      #
      # -w matches `filename` as a whole word, so the macro's own name
      # (capture_key_from_filename) is not a hit. One exception:
      # stg_test_fixture_tree_reads_no_s3_object reads each source's physical
      # path to prove a fixture build issues no s3:// read. It parses no
      # metadata from it. YAML is not scanned, because a unit test's given rows
      # for a source must supply its filename column.
      - name: Check no model or test parses a filename
        run: |
          hits=$(grep -rnw filename models tests --include='*.sql' \
            | grep -v '^tests/stg_test_fixture_tree_reads_no_s3_object\.sql:' || true)
          if [ -n "$hits" ]; then
            echo "::error::filename used outside capture_key_from_filename (#104 AC2, #88 E8):"
            echo "$hits"
            exit 1
          fi
          echo "no model or test reads filename"

      # Every payload staging model must declare a relationships test from
      # capture_key to int_admitted_capture, so a new stg_ model cannot skip
      # the admission join unnoticed. stg_run is exempt: it is built from run
      # manifests, not payloads, and has no capture_key.
      - name: Check every staging model tests capture_key against admission
        run: |
          uv run python - <<'PY'
          import json, sys

          EXEMPT = {"stg_run"}
          with open("target/manifest.json") as fh:
              nodes = json.load(fh)["nodes"].values()
          staging = {n["name"] for n in nodes
                     if n["resource_type"] == "model" and n["name"].startswith("stg_")}
          covered = set()
          for n in nodes:
              meta = n.get("test_metadata") or {}
              kwargs = meta.get("kwargs", {})
              if (meta.get("name") == "relationships"
                      and n.get("column_name") == "capture_key"
                      and "int_admitted_capture" in str(kwargs.get("to"))
                      and kwargs.get("field") == "capture_key"):
                  covered.add(n["attached_node"].rsplit(".", 1)[-1])
          problems = []
          if not staging - EXEMPT:
              problems.append("no stg_ models found; nothing was checked")
          problems += [f"{m} has no relationships test from capture_key to int_admitted_capture"
                       for m in sorted(staging - EXEMPT - covered)]
          for problem in problems:
              print(f"::error::{problem}")
          if not problems:
              print(f"checked {len(staging - EXEMPT)} staging models")
          sys.exit(1 if problems else 0)
          PY

      - name: Check exactly the served models are public
        run: |
          uv run dbt ls --resource-type model \
            --output json --output-keys name access > /tmp/models.json
          uv run python - <<'PY'
          import json, sys

          SERVED = {
              "fct_player_fixture", "fct_player_gameweek",
              "dim_team", "dim_player", "dim_fixture",
          }
          models = {}
          with open("/tmp/models.json") as fh:
              for line in fh:
                  line = line.strip()
                  if line.startswith("{"):
                      node = json.loads(line)
                      models[node["name"]] = node["access"]

          public = {name for name, access in models.items() if access == "public"}
          problems = []
          if public != SERVED:
              problems.append(
                  f"public models {sorted(public)} are not the served set "
                  f"{sorted(SERVED)}")
          internal = [n for n in models if n.startswith(("stg_", "int_", "base_"))]
          if not internal:
              problems.append("no stg_/int_/base_ models listed; nothing was checked")
          problems += [f"{n} is {models[n]}, not private"
                       for n in internal if models[n] != "private"]
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

  # Required check, and the real one: this is where the models get built and
  # every assertion in the fast tiers actually runs.
  #
  # It needs no AWS credentials, no OIDC role and no repository variables,
  # because it does not read S3 at all. `--target fixtures` builds against
  # tests/fixtures/raw — a checked-in capture of real objects, three runs over
  # five players — instead of the ~74k-object live bucket. That tree is what
  # makes these tiers hermetic: see tests/fixtures/build_fixtures.py, which
  # documents every edge case it covers and regenerates it.
  #
  # The isolation is the resolved path: under that target sources.yml points
  # DuckDB at a local relative path, so no s3:// URL is ever issued. The
  # credential assertion below is belt-and-braces, and it is not redundant —
  # DuckDB autoloads httpfs on demand and would happily use ambient AWS_*
  # variables if a future change ever reintroduced an s3:// path here.
  #
  # Before this existed the fast tiers could not be a PR check at all. Every
  # data test needs the models built; building them meant reading the live
  # bucket; and this repo has no route to that bucket from Actions (the only
  # OIDC role in the account trusts fpl-ingest and nothing else). So the entire
  # PR-blocking path is now `validate` plus this job, and neither touches AWS.
  #
  # e2e is deliberately absent. It asserts the build read the real accumulated
  # raw tree, which is exactly what a fixture build is not — see `live-tests`.
  fixture-tests:
    runs-on: ubuntu-latest

    # No `permissions: id-token: write`. Stated rather than omitted, because
    # its absence is the point: this job cannot assume an AWS role even if a
    # future step tried to.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # packages.yml (audit_helper, for the served diff) must be installed
      # before dbt will parse the project.
      - name: Install dbt packages
        run: uv run dbt deps

      # Turns "this job needs no credentials" from a claim into something the
      # run verifies. If a well-meaning change ever adds an AWS step here, the
      # job fails loudly rather than quietly putting a production read back on
      # the PR-blocking path.
      - name: Assert no AWS session is present
        run: |
          leaked=$(env | grep -o '^AWS_[A-Z_]*' || true)
          if [ -n "$leaked" ]; then
            echo "::error::AWS variables are set in a job that must not need \
          them: $leaked. The fixture tiers read tests/fixtures/raw, never S3."
            exit 1
          fi
          echo "no AWS_* variables in the environment — fixture build is credential-free"

      # profiles.yml puts the fixture database at .local/fixtures.duckdb, and
      # .local/ is gitignored so it does not exist on a fresh checkout.
      - name: Create the local database directory
        run: mkdir -p .local

      # Seeds and models only. The tiers run as their own steps below so a
      # failure names the tier it came from. `dbt run` loads no seed, so the
      # seed step comes first (seed_run_origin, #96).
      - name: Load seeds
        run: uv run dbt seed --target fixtures

      - name: Build models against the fixture capture
        run: uv run dbt run --target fixtures

      - name: Fast tier — unit
        run: uv run dbt test --target fixtures --select tag:unit

      - name: Fast tier — integration
        run: uv run dbt test --target fixtures --select tag:integration

  # Required check. The pytest suite for scripts/, in scripts/tests/ —
  # pyproject.toml's testpaths keeps pytest out of dbt's tests/.
  #
  # scripts/tests/conftest.py fails collection when a test lacks exactly one
  # tier marker or a well-formed covers("#<issue> AC<n>"), so this job enforces
  # tracing and tiering as well as running the tests — the Python counterpart
  # of `validate`'s tier-tag check. pytest exits non-zero when it collects
  # nothing, so an empty suite cannot pass silently.
  #
  # Credential-free like `fixture-tests`, and asserted the same way.
  python-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # packages.yml (audit_helper, for the served diff) must be installed
      # before dbt will parse the project.
      - name: Install dbt packages
        run: uv run dbt deps

      - name: Assert no AWS session is present
        run: |
          leaked=$(env | grep -o '^AWS_[A-Z_]*' || true)
          if [ -n "$leaked" ]; then
            echo "::error::AWS variables are set in a job that must not need \
          them: $leaked. The Python tests must never read S3."
            exit 1
          fi
          echo "no AWS_* variables in the environment — Python tests are credential-free"

      - name: Python tests — unit and integration
        run: uv run pytest -v

  # Not a PR check, and still cannot be one.
  #
  # This is the tier that must read the live bucket: e2e asserts staging was
  # built from the real accumulated raw tree, which no fixture can stand in
  # for. Reaching that bucket from Actions needs an IAM role trusting this
  # repo, and there is none — the only OIDC role in the account
  # (github-actions-fpl-ingest) trusts
  # `repo:gisaf22/fpl-ingest:ref:refs/heads/main` and nothing else, and
  # fpl-warehouse has no repository variables or secrets set. Standing one up
  # is the Phase 5 automation item CLAUDE.md parks under "S3 credentials for
  # local dbt runs"; until it lands this job is manual.
  #
  # What changed when the fixture tiers landed is only what depends on this
  # job: nothing on a PR does any more. It still runs all three tiers against
  # live S3, unchanged, so the fast tiers are also confirmed against real data
  # and not only against the five-player fixture.
  live-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # profiles.yml reads DBT_DUCKDB_THREADS directly. HISTORY_ROOT is NOT read
    # by dbt itself — it is passed to each dbt command as `--vars` below. It
    # cannot be an env_var() default in dbt_project.yml: sources.yml guards the
    # history glob on `{% if var("history_root") %}`, and a var whose value is
    # the literal string "{{ env_var(...) }}" is truthy, so the guard would fire
    # on every build and emit an unrendered Jinja path. Verified 2026-09-21.
    #
    # The fallbacks cover the push/pull_request events, where the inputs do not
    # exist — though this job does not run on those anyway.
    #
    # HISTORY_ROOT defaults to empty, which renders the live glob alone, byte
    # identical to passing no --vars at all. So an ordinary dispatch is the
    # single-season build this project has always run. It is deliberately an
    # input rather than a repository variable: pointing a build at history is a
    # per-run decision made while porting a season, not standing configuration.
    env:
      DBT_DUCKDB_THREADS: ${{ github.event.inputs.duckdb_threads || '32' }}
      HISTORY_ROOT: ${{ github.event.inputs.history_root || '' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require an AWS role to be configured
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::error::Set the AWS_ROLE_ARN repository variable to an IAM \
          role whose trust policy admits repo:${{ github.repository }}. Until \
          then this job cannot reach the raw capture bucket and no live data \
          test can run. See CLAUDE.md, 'S3 credentials for local dbt runs'."
            exit 1
          fi

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # packages.yml (audit_helper, for the served diff) must be installed
      # before dbt will parse the project.
      - name: Install dbt packages
        run: uv run dbt deps

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Create the local database directory
        run: mkdir -p .local

      # LIST-only: glob() returns key names and opens no payload, so this
      # isolates S3 listing from the ~50k object GETs that dominate the build
      # below. Runs first so nothing is warmed. See scripts/measure_glob.py for
      # what the three globs distinguish and why it matters.
      - name: Measure glob expansion in isolation
        run: uv run python scripts/measure_glob.py

      # Models only. The tiers are run as their own steps below so a failure
      # names the tier it came from.
      #
      # `/usr/bin/time -v` reports peak RSS and wall clock on stderr and
      # propagates dbt's exit code, so it changes nothing about whether the job
      # passes. Peak RSS is the number to watch when raising DBT_DUCKDB_THREADS:
      # the element-summary read OOM'd at 12.7 GiB before
      # preserve_insertion_order was turned off, and a runner has ~16 GB.
      - name: Load seeds
        run: uv run dbt seed

      - name: Build models
        run: >-
          /usr/bin/time -v uv run dbt run
          --vars "{history_root: '$HISTORY_ROOT'}"

      - name: Runner memory after the build
        if: always()
        run: free -m

      # What the build actually produced — row count per model, and the
      # per-season breakdown — into the job summary.
      #
      # The runner's DuckDB dies with the job and nothing exports it, so a CI
      # build's rows cannot be diffed afterwards the way a local build's can.
      # Without this the only CI-side evidence is "59 tests passed", which says
      # nothing about shape: a build that read half the raw tree still passes
      # every test, because every test is relative to what was read.
      #
      # Runs before the test tiers, so the shape is recorded even when a tier
      # below fails — that is exactly the run where you want to see it. It
      # reports and never asserts, so it cannot fail the job on its own.
      - name: Report build shape
        run: uv run python scripts/summarize_build.py

      - name: Fast tier — unit
        run: >-
          uv run dbt test --select tag:unit
          --vars "{history_root: '$HISTORY_ROOT'}"

      - name: Fast tier — integration
        run: >-
          uv run dbt test --select tag:integration
          --vars "{history_root: '$HISTORY_ROOT'}"

      - name: e2e tier
        run: >-
          uv run dbt test --select tag:e2e
          --vars "{history_root: '$HISTORY_ROOT'}"
