# Scheduled live build — the recurring proof that the project still builds and
# every tier still passes against the real accumulated raw tree.
#
# This is the counterpart to fpl-ingest's scheduled_run_daily.yml: that job
# writes new raw captures to S3 twice a day, and this one reads them back
# through the whole DAG shortly afterwards. Between them, a break anywhere —
# a raw shape change, a dedup edge case a new capture exposes, a served
# contract drift — surfaces within hours instead of at the next manual run.
#
# It is also the publish path. The `dev` target writes .local/warehouse.duckdb
# on the runner, which still dies with the runner — but the final step now
# exports the five served tables from it to parquet and uploads them to
# s3://fpl-data-safari/served/, overwritten in place, alongside a
# _manifest.json. That is what fpl-intelligence reads, via
# duckdb.read_parquet() against those stable keys. See CLAUDE.md,
# "Served contract". So this workflow is both a validation signal and a
# deployment, and a build that fails its tests publishes nothing.
#
# Scheduling is deliberately a cron offset rather than a repository_dispatch
# fired by fpl-ingest on completion. A true trigger-on-completion is the
# stronger design and remains the upgrade path, but it needs a dispatch step
# and a cross-repo token in fpl-ingest, and the measured timing (below) leaves
# enough margin that it buys nothing yet.

name: Scheduled Build

on:
  schedule:
    # 07:45 and 19:45 UTC — 45 minutes after fpl-ingest's daily 07:00/19:00.
    #
    # The offset is sized against GitHub's scheduler, not against the ingest
    # job's runtime, because the scheduler is by far the larger term. Measured
    # over 26 scheduled fpl-ingest runs (2026-08-28 → 2026-09-10):
    #
    #   ingest job duration        median  3.2m   p90  8.6m   max  9.0m
    #   delay from cron to start   median 14.9m   p90 23.6m   max 24.5m
    #   ingest FINISHED at cron+   median 18.6m   p90 27.7m   max 32.0m
    #
    # So the naive 30-minute offset is not safe: ingest has been observed still
    # running 32 minutes past its nominal cron time. 45 minutes clears the
    # worst observed finish by 13 minutes even in the pessimistic case where
    # this workflow's own scheduler delay is zero — and in practice this run
    # inherits a comparable 10-25 minute delay of its own, so the real gap is
    # wider. :45 is also off the top of the hour, where the queueing that
    # causes those delays is heaviest.
    #
    # Re-check this if fpl-ingest's runtime grows: the number to beat is its
    # max "finished at cron+", not its duration.
    - cron: "45 7,19 * * *"

  # Manual trigger, for testing this workflow and for an on-demand rebuild
  # without waiting for the schedule:
  #   gh workflow run scheduled_build.yml
  #
  # The two inputs are the publish step's overrides and exist only for a
  # manual run; a scheduled run has neither. Each is recorded in the published
  # _manifest.json. See scripts/publish_served.py and CLAUDE.md, "The publish
  # floor is computed, not configured".
  #   gh workflow run scheduled_build.yml -f restate=2026-27
  #   gh workflow run scheduled_build.yml -f without_baseline=true
  workflow_dispatch:
    inputs:
      restate:
        description: >-
          Seasons allowed to publish fewer rows than the previous publish,
          comma- or space-separated (e.g. 2026-27). Leave empty normally.
        type: string
        default: ""
      without_baseline:
        description: >-
          Publish even if the previous served/_manifest.json is missing or
          unreadable.
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

# A build reads ~74k S3 objects and takes 7-16 minutes (measured 2026-09-15/16;
# see the timeout comment below for the spread and why it is a spread).
# Overlapping runs would race on nothing shared, but they would double the read
# for no benefit, so queue them instead. Not cancel-in-progress: a run already
# most of the way through a full read should be allowed to finish and report.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # NOT a required check, and must not become one. This job depends on live S3
  # and on fpl-ingest's output, so it fails for reasons that have nothing to do
  # with whatever is in an open pull request — a bad capture upstream would
  # otherwise block every unrelated merge. The PR-blocking path stays exactly
  # `validate` plus `fixture-tests` from ci.yml, both credential-free. A
  # failure here is informational: it pages a human, it does not gate code.
  build:
    runs-on: ubuntu-latest

    # The scheduled build is multi-season as of the 2025-26 history port's
    # publish step. Same mechanism as ci.yml's live-tests job, which proved it
    # on 2026-09-21 (run 35632785680): HISTORY_ROOT is NOT read by dbt itself —
    # sources.yml guards the history glob on `{% if var("history_root") %}`,
    # and an env_var() default would be the truthy literal string
    # "{{ env_var(...) }}", firing the guard on every build and emitting an
    # unrendered Jinja path. So it is passed to `dbt build` as --vars below.
    #
    # Unlike live-tests this is a constant, not a dispatch input. There is no
    # per-run decision to make here: every scheduled build publishes every
    # season, and a build that quietly dropped one would overwrite good served
    # data with a single-season table. Changing what gets published is a code
    # change, reviewed, not a field someone fills in at dispatch time.
    env:
      HISTORY_ROOT: s3://fpl-data-safari/history

    # Bounds a hung S3 read rather than letting it burn the 6-hour default.
    #
    # Sized against the worst observed run, not the typical one, because the
    # element-summary read varies far more than it grows. Measured at 32
    # threads over ~74k objects within 18 hours of each other:
    #
    #   2026-09-15 07:49  stg_player_fixture 409s   job  7m11s
    #   2026-09-15 19:48  stg_player_fixture 441s   job  7m43s
    #   2026-09-16 01:40  stg_player_fixture 925s   job 15m50s
    #
    # That 2.3x spread at identical configuration is the thing to survive; the
    # old 30 was 3x headroom over a 10.3m build (run 34501607108) that is no
    # longer representative, and 15m50s had already eaten half of it.
    #
    # 45 keeps roughly the same 3x rule against 15m50s. It is deliberately not
    # higher: the OIDC session is one hour, so a longer budget lets a genuinely
    # stuck build race its own credentials and die with an opaque expiry
    # instead of a clean timeout. 45 plus ~1m of setup leaves that margin
    # intact.
    #
    # Re-check this against the worst run, not the median, whenever the raw
    # tree grows materially.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Same guard as ci.yml's live-tests job, and for the same reason: with no
      # AWS_ROLE_ARN the aws-actions step fails with an opaque credentials
      # error. This says what to actually do about it.
      - name: Require an AWS role to be configured
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::error::Set the AWS_ROLE_ARN repository variable to an IAM \
          role whose trust policy admits repo:${{ github.repository }} on \
          refs/heads/main. Until then this workflow cannot reach the raw \
          capture bucket. See CLAUDE.md, 'Scheduled build'."
            exit 1
          fi

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # packages.yml (audit_helper, for the served diff) must be installed
      # before dbt will parse the project.
      - name: Install dbt packages
        run: uv run dbt deps

      # A scheduled run's OIDC subject is the ref form —
      # repo:gisaf22/fpl-warehouse:ref:refs/heads/main — because a schedule
      # always runs on the default branch. There is no distinct `schedule`
      # subject format, so the role's existing main entry covers this workflow
      # and no trust-policy change is needed for the schedule as such.
      #
      # The session is an AssumeRoleWithWebIdentity session (1 hour by
      # default), not the 15-minute `aws login` export that forced the
      # threads: 32 setting locally — so the build is not racing its
      # credentials here, and 32 is a performance setting in CI rather than the
      # correctness requirement it is locally.
      #
      # Keep it at 32 regardless, but not on the old reasoning that more
      # concurrency is monotonically better: measured 2026-09-16 on this runner,
      # 64 threads built stg_player_fixture in 332s and 128 in 397s — slower —
      # with peak RSS pinned at ~14.5 GiB of the runner's 15.6 GiB in both. The
      # read is memory-bound well before 128, not purely latency-bound. See
      # CLAUDE.md, "S3 credentials for local dbt runs".
      #
      # Effectively the whole job is this one model: stg_player_fixture was 409s,
      # 441s and 925s across three 32-thread runs within 18 hours, against job
      # totals of 7m11s, 7m43s and 15m50s. Every other model is sub-second.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # profiles.yml puts the dev database at .local/warehouse.duckdb, and
      # .local/ is gitignored so it does not exist on a fresh checkout.
      - name: Create the local database directory
        run: mkdir -p .local

      # Input guard (#39): refuse to rebuild served/ from stale live captures.
      # bootstrap-static, fixtures and event-status warn when their newest
      # capture is over 6h old (one missed ingest run) and error over 18h (two).
      # element-summary is exempt, and the history tree is never read here:
      # --vars history_root is not passed, so only the live globs are checked.
      # See CLAUDE.md, "Source freshness".
      #
      # An error fails this step, so `dbt build` and the publish are skipped
      # and the healthchecks.io ping below sends /fail. A warning passes. Each
      # source's age goes to the job summary either way, and a warning or error
      # is also raised as an annotation.
      - name: Check live source freshness
        run: |
          status=0
          uv run dbt source freshness || status=$?
          if [ -f target/sources.json ]; then
            {
              echo "### Source freshness"
              jq -r '.results[] | "- `\(.unique_id | split(".") | last)`: \(.status), newest capture \(.max_loaded_at // "none"), \(((.max_loaded_at_time_ago_in_s // 0) / 360 | round) / 10)h old"' target/sources.json
            } >> "$GITHUB_STEP_SUMMARY"
            jq -r '.results[] | select(.status == "warn" or .status == "error" or .status == "runtime error") | "::\(if .status == "warn" then "warning" else "error" end)::source freshness \(.status): \(.unique_id | split(".") | last), newest capture \(.max_loaded_at // "none")"' target/sources.json
          fi
          exit "$status"

      # `dbt build`, not `dbt run` then `dbt test`: build interleaves each
      # model with its own tests in DAG order, so a model whose tests fail does
      # not have its dependents built on top of it. All three tiers run,
      # including e2e, which is the tier that only means anything here — it
      # asserts staging was built from the real accumulated raw tree, which is
      # exactly what the fixture target cannot stand in for.
      #
      # Failure is loud by construction: dbt exits 1 when any model errors or
      # any test fails, Actions' default `bash -e` propagates that, and the run
      # is marked failed — which is the notification. Verified 2026-09-10: a
      # deliberately failing test returned exit 1 from `dbt build`. Every test
      # in the project is error severity (no `severity: warn` anywhere), so
      # there is no path where a real failure lands as a passing warning.
      - name: Build and test against live S3
        run: >-
          uv run dbt build
          --vars "{history_root: '$HISTORY_ROOT'}"

      # Publishes the served fact and dimension tables to s3://fpl-data-safari/served/,
      # overwriting in place — no dated keys, no versioning. Consumers read the
      # current objects; there is no published history to pin to.
      #
      # if: success() is explicit rather than implied. The default for a step is
      # already success(), so this changes nothing today, but it states the
      # invariant the publish depends on: a failed or partially-tested build
      # must never overwrite good served data. Anyone adding continue-on-error
      # or an always() step above has to step past this line to break it.
      #
      # The script's own row-count floor is the second guard, for the case dbt
      # exits 0 having built a table that is empty, or missing a whole season,
      # for an upstream reason. That floor is computed per season from the
      # build's own staging tables rather than hardcoded — see the script.
      #
      # It also refuses a season that holds fewer rows than the previous
      # publish's manifest recorded, which the staging-derived floor cannot see
      # when rows are lost upstream of staging. The dispatch inputs are the
      # overrides. They reach the script through env rather than being
      # interpolated into the command, so an input value is never parsed as
      # shell.
      - name: Publish served tables to S3
        if: success()
        env:
          RESTATE: ${{ inputs.restate }}
          WITHOUT_BASELINE: ${{ inputs.without_baseline }}
        run: |
          args=()
          for season in ${RESTATE//,/ }; do
            args+=(--restate "$season")
          done
          if [ "$WITHOUT_BASELINE" = "true" ]; then
            args+=(--without-baseline)
          fi
          uv run python scripts/publish_served.py "${args[@]}"

      # Heartbeat to healthchecks.io (#79). The last step, on every outcome of
      # a scheduled run, and it can never change the job's conclusion.
      #
      # job.status is `success` only if the publish above succeeded, and
      # publish_served.py uploads _manifest.json last, so a success ping means
      # the manifest landed. A stale-input freshness error or a failed build
      # (both skip the publish), a refused publish or an upload error all send
      # /fail.
      #
      # Manual runs do not ping, including restate and without_baseline runs,
      # so they neither raise nor clear an alert. job.status is passed through
      # env, not interpolated into the script. The script is duplicated from
      # fpl-ingest's and needs no uv environment, so it still runs when
      # `uv sync` has failed. See CLAUDE.md, "Scheduled build".
      - name: Ping healthchecks.io
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        timeout-minutes: 2
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL_SCHEDULED_BUILD }}
          JOB_STATUS: ${{ job.status }}
        run: bash scripts/healthchecks_ping.sh "$JOB_STATUS"
