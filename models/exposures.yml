version: 2

exposures:
  - name: fpl_intelligence
    type: application
    maturity: low
    description: >
      fpl-intelligence, the downstream decision layer and the consumer slice 4
      of Epic #27 is built for. It is not yet reading served/: as of 2026-10-10
      it still reads its own local database (#143). When it does, it reads the
      served parquet and nothing else: the two `fct_` facts, the three `dim_`
      dimensions (#44), the player status history (#127) and the market
      snapshot (#143). Staging and intermediate models are `access: private`
      and outside the served contract.

      This exposure documents the dependency and makes it visible in the DAG
      and in `dbt ls --select +exposure:fpl_intelligence`. It enforces nothing
      at runtime. See CLAUDE.md, "Served contract".
    owner:
      name: Safari Gisa
      email: safari.gisa@gmail.com
    depends_on:
      - ref('fct_player_fixture')
      - ref('fct_player_gameweek')
      - ref('dim_team')
      - ref('dim_player')
      - ref('dim_fixture')
      - ref('dim_player_status_history')
      - ref('fct_player_market_snapshot')
