version: 2

exposures:
  - name: fpl_intelligence
    type: application
    maturity: medium
    description: >
      fpl-intelligence, the downstream decision layer. It reads the served
      models and nothing else: the two `fct_` facts, the three `dim_`
      dimensions (#44) and the player status history (#127). Staging and intermediate models are `access: private`
      and outside the served contract.

      This exposure documents the dependency and makes it visible in the DAG
      and in `dbt ls --select +exposure:fpl_intelligence`. It does not enforce
      anything at runtime: fpl-intelligence connects to the warehouse with raw
      SQL, not through dbt, so nothing here prevents it from selecting from a
      staging table. See CLAUDE.md, "Served contract".
    owner:
      name: Safari Gisa
      email: safari.gisa@gmail.com
    depends_on:
      - ref('fct_player_fixture')
      - ref('fct_player_gameweek')
      - ref('dim_team')
      - ref('dim_player')
      - ref('dim_fixture')
      - ref('dim_player_status_history')
