version: 2

# dbt unit tests for the staging layer. Each carries exactly one tier tag, like
# every other test, and a `covers` meta entry naming the board item and
# acceptance criterion it pins.
#
# The raw sources are read through `external_location`, so there is no
# relation for dbt to introspect columns from, and dict-format `rows` fail with
# "Not able to get columns for unit test". Source inputs are therefore given as
# `format: sql`, which declares each column's type itself. Every column the
# model reads must be listed, null where the case does not care.

unit_tests:

  # --- stg_fixture: fixtures staged per capture (#37) --------------------------

  - name: unscheduled_fixture_is_staged_with_null_round_and_kickoff
    description: >
      A fixture FPL has not scheduled — postponed, or not yet given a date —
      has no round and no kickoff. It still exists and will be played, so it is
      staged with both null: not dropped, and not given a round or time.
    model: stg_fixture
    config:
      tags: [unit]
      meta:
        covers: "#37 AC2"
    given:
      - input: source('fpl_raw', 'fixtures')
        format: sql
        rows: |
          select
              'tests/fixtures/raw/fpl/fixtures/2026-09-14/20260914T211204Z-a730c3/payload.json' as filename,
              57::bigint as id, null::bigint as event, null::timestamp as kickoff_time,
              3::bigint as team_h, 14::bigint as team_a,
              null::bigint as team_h_score, null::bigint as team_a_score, false as finished,
              3::bigint as team_h_difficulty, 4::bigint as team_a_difficulty
      - input: ref('int_admitted_capture')
        rows:
          - {capture_key: "raw/fpl/fixtures/2026-09-14/20260914T211204Z-a730c3/payload.json", season: "2026-27", run_id: "20260914T211204Z-a730c3"}
    expect:
      rows:
        - {season: "2026-27", run_id: "20260914T211204Z-a730c3", fixture_id: 57, gameweek: null, kickoff_time: null, team_h_fpl_id: 3, team_a_fpl_id: 14}

  - name: postponed_fixture_keeps_each_captures_round_as_reported
    description: >
      A fixture scheduled in round 5, postponed (round and kickoff withdrawn),
      then rescheduled into round 12 is three captures and three rows, each
      with the round and kickoff that capture reported. The postponed capture
      stays null rather than inheriting either neighbour's round.
    model: stg_fixture
    config:
      tags: [unit]
      meta:
        covers: "#37 AC2"
    given:
      - input: source('fpl_raw', 'fixtures')
        format: sql
        rows: |
          select * from (values
              ('tests/fixtures/raw/fpl/fixtures/2026-09-06/20260906T191056Z-6d5820/payload.json',
               41::bigint, 5::bigint,    timestamp '2026-09-27 14:00:00'),
              ('tests/fixtures/raw/fpl/fixtures/2026-09-14/20260914T211204Z-a730c3/payload.json',
               41::bigint, null::bigint, null::timestamp),
              ('tests/fixtures/raw/fpl/fixtures/2026-09-20/20260920T191100Z-0f0f0f/payload.json',
               41::bigint, 12::bigint,   timestamp '2026-11-25 19:30:00')
          ) as t(filename, id, event, kickoff_time),
          lateral (select
              6::bigint as team_h, 9::bigint as team_a,
              null::bigint as team_h_score, null::bigint as team_a_score, false as finished,
              2::bigint as team_h_difficulty, 3::bigint as team_a_difficulty)
      - input: ref('int_admitted_capture')
        rows:
          - {capture_key: "raw/fpl/fixtures/2026-09-06/20260906T191056Z-6d5820/payload.json", season: "2026-27", run_id: "20260906T191056Z-6d5820"}
          - {capture_key: "raw/fpl/fixtures/2026-09-14/20260914T211204Z-a730c3/payload.json", season: "2026-27", run_id: "20260914T211204Z-a730c3"}
          - {capture_key: "raw/fpl/fixtures/2026-09-20/20260920T191100Z-0f0f0f/payload.json", season: "2026-27", run_id: "20260920T191100Z-0f0f0f"}
    expect:
      rows:
        - {run_id: "20260906T191056Z-6d5820", fixture_id: 41, gameweek: 5,    kickoff_time: "2026-09-27 14:00:00"}
        - {run_id: "20260914T211204Z-a730c3", fixture_id: 41, gameweek: null, kickoff_time: null}
        - {run_id: "20260920T191100Z-0f0f0f", fixture_id: 41, gameweek: 12,   kickoff_time: "2026-11-25 19:30:00"}

  - name: same_fixture_id_in_two_seasons_is_two_rows_each_with_its_own_season
    description: >
      fixture_id is reassigned every season, so id 1 in the ported season and
      id 1 in the live season are different matches. Each row takes its season
      from its capture's index entry (#104) and the two never merge. The ported
      row has no kickoff, so the season is shown to come from the index and not
      the date.
    model: stg_fixture
    config:
      tags: [unit]
      meta:
        covers: "#37 AC3"
    overrides:
      vars:
        season: "2026-27"
    given:
      - input: source('fpl_raw', 'fixtures')
        format: sql
        rows: |
          select * from (values
              ('s3://bucket/history/2025-26/fpl/fixtures/2026-05-26/20260526T034626Z-2a6b73/payload.json',
               1::bigint, null::bigint, null::timestamp, 12::bigint, 4::bigint),
              ('s3://bucket/raw/fpl/fixtures/2026-09-14/20260914T211204Z-a730c3/payload.json',
               1::bigint, 1::bigint, timestamp '2026-08-21 19:00:00', 1::bigint, 7::bigint)
          ) as t(filename, id, event, kickoff_time, team_h, team_a),
          lateral (select
              null::bigint as team_h_score, null::bigint as team_a_score, false as finished,
              null::bigint as team_h_difficulty, null::bigint as team_a_difficulty)
      - input: ref('int_admitted_capture')
        rows:
          - {capture_key: "history/2025-26/fpl/fixtures/2026-05-26/20260526T034626Z-2a6b73/payload.json", season: "2025-26", run_id: "20260526T034626Z-2a6b73"}
          - {capture_key: "raw/fpl/fixtures/2026-09-14/20260914T211204Z-a730c3/payload.json", season: "2026-27", run_id: "20260914T211204Z-a730c3"}
    expect:
      rows:
        - {season: "2025-26", fixture_id: 1, team_h_fpl_id: 12, team_a_fpl_id: 4}
        - {season: "2026-27", fixture_id: 1, team_h_fpl_id: 1,  team_a_fpl_id: 7}

  # --- stg_player: status and availability per capture (#125) ----------------
  #
  # bootstrap-static's records sit in the `elements` array, so the source mock
  # is one row per payload with `elements` as a list of structs. Each element
  # carries every field stg_player reads.

  - name: unadmitted_capture_contributes_no_player_rows
    description: >
      Two bootstrap-static captures of the same player, only one of them
      admitted. Staging keeps the admitted capture's row and none of the other's:
      a local or non-production capture must never reach the status history.
    model: stg_player
    config:
      tags: [unit]
      meta:
        covers: "#125 AC2"
    given:
      - input: source('fpl_raw', 'bootstrap_static')
        format: sql
        rows: |
          select * from (values
              ('tests/fixtures/raw/fpl/bootstrap-static/2026-09-14/20260914T211204Z-a730c3/payload.json', 'a'),
              ('tests/fixtures/raw/fpl/bootstrap-static/2026-09-02/20260902T163935Z-07eb06/payload.json', 'i')
          ) as t(filename, status),
          lateral (select [{
              'id': 7::bigint, 'web_name': 'Player', 'code': 1007::bigint,
              'element_type': 3::bigint, 'total_points': 12::bigint,
              'status': status,
              'chance_of_playing_this_round': null::bigint,
              'chance_of_playing_next_round': null::bigint,
              'news': 'Knee injury', 'news_added': '2026-09-01T10:00:00.000000Z',
              'can_select': true, 'removed': false, 'team': 4::bigint,
              'now_cost': 55::bigint, 'selected_by_percent': '1.0',
              'transfers_in_event': 0::bigint, 'transfers_out_event': 0::bigint
          }] as elements, 10000000::bigint as total_players)
      - input: ref('int_admitted_capture')
        rows:
          - {capture_key: "raw/fpl/bootstrap-static/2026-09-14/20260914T211204Z-a730c3/payload.json", season: "2026-27", run_id: "20260914T211204Z-a730c3"}
    expect:
      rows:
        - {run_id: "20260914T211204Z-a730c3", fpl_id: 7, status: "a"}

  - name: empty_news_is_staged_as_null
    description: >
      FPL publishes no news as an empty string. Staged as NULL, so an empty
      string and a null never read as a change in the status history. Real
      news is kept as published.
    model: stg_player
    config:
      tags: [unit]
      meta:
        covers: "#125 AC3"
    given:
      - input: source('fpl_raw', 'bootstrap_static')
        format: sql
        rows: |
          select
              'tests/fixtures/raw/fpl/bootstrap-static/2026-09-14/20260914T211204Z-a730c3/payload.json' as filename,
              [
                  {'id': 7::bigint, 'web_name': 'Fit', 'code': 1007::bigint,
                   'element_type': 3::bigint, 'total_points': 12::bigint,
                   'status': 'a',
                   'chance_of_playing_this_round': null::bigint,
                   'chance_of_playing_next_round': null::bigint,
                   'news': '', 'news_added': null::varchar,
                   'can_select': true, 'removed': false, 'team': 4::bigint,
                   'now_cost': 55::bigint, 'selected_by_percent': '1.0',
                   'transfers_in_event': 0::bigint, 'transfers_out_event': 0::bigint},
                  {'id': 8::bigint, 'web_name': 'Hurt', 'code': 1008::bigint,
                   'element_type': 2::bigint, 'total_points': 3::bigint,
                   'status': 'd',
                   'chance_of_playing_this_round': 75::bigint,
                   'chance_of_playing_next_round': 75::bigint,
                   'news': 'Knock - 75% chance of playing', 'news_added': '2026-09-12T18:30:05.123456Z',
                   'can_select': true, 'removed': false, 'team': 9::bigint,
                   'now_cost': 45::bigint, 'selected_by_percent': '0.4',
                   'transfers_in_event': 0::bigint, 'transfers_out_event': 0::bigint}
              ] as elements,
              10000000::bigint as total_players
      - input: ref('int_admitted_capture')
        rows:
          - {capture_key: "raw/fpl/bootstrap-static/2026-09-14/20260914T211204Z-a730c3/payload.json", season: "2026-27", run_id: "20260914T211204Z-a730c3"}
    expect:
      rows:
        - {fpl_id: 7, news: null, news_added: null, chance_of_playing_this_round: null, team_fpl_id: 4}
        - {fpl_id: 8, news: "Knock - 75% chance of playing", news_added: "2026-09-12 18:30:05.123456", chance_of_playing_this_round: 75, team_fpl_id: 9}

  # stg_player's market fields (#140). Each mock element carries every field
  # stg_player reads, and each payload its root total_players.

  - name: market_fields_are_typed_and_carry_their_captures_total_players
    description: >
      Two admitted captures of the same player, with different prices,
      ownership, transfers and total_players. Each row carries its own
      capture's values, typed, and the total_players of its own capture's root.
    model: stg_player
    config:
      tags: [unit]
      meta:
        covers: "#140 AC1"
    given:
      - input: source('fpl_raw', 'bootstrap_static')
        format: sql
        rows: |
          select * from (values
              ('tests/fixtures/raw/fpl/bootstrap-static/2026-08-31/20260831T203609Z-227b9b/payload.json', 80, '28.7', 6269, 32314, 10203953),
              ('tests/fixtures/raw/fpl/bootstrap-static/2026-09-06/20260906T191056Z-6d5820/payload.json', 79, '27.7', 19318, 117024, 10539915)
          ) as t(filename, cost, ownership, t_in, t_out, players),
          lateral (select [{
              'id': 427::bigint, 'web_name': 'Player', 'code': 1427::bigint,
              'element_type': 3::bigint, 'total_points': 12::bigint,
              'status': 'a',
              'chance_of_playing_this_round': null::bigint,
              'chance_of_playing_next_round': null::bigint,
              'news': '', 'news_added': null::varchar,
              'can_select': true, 'removed': false, 'team': 4::bigint,
              'now_cost': cost::bigint, 'selected_by_percent': ownership,
              'transfers_in_event': t_in::bigint, 'transfers_out_event': t_out::bigint
          }] as elements, players::bigint as total_players)
      - input: ref('int_admitted_capture')
        rows:
          - {capture_key: "raw/fpl/bootstrap-static/2026-08-31/20260831T203609Z-227b9b/payload.json", season: "2026-27", run_id: "20260831T203609Z-227b9b"}
          - {capture_key: "raw/fpl/bootstrap-static/2026-09-06/20260906T191056Z-6d5820/payload.json", season: "2026-27", run_id: "20260906T191056Z-6d5820"}
    expect:
      rows:
        - {run_id: "20260831T203609Z-227b9b", fpl_id: 427, now_cost: 80, selected_by_percent: 28.7, transfers_in_event: 6269, transfers_out_event: 32314, total_players: 10203953}
        - {run_id: "20260906T191056Z-6d5820", fpl_id: 427, now_cost: 79, selected_by_percent: 27.7, transfers_in_event: 19318, transfers_out_event: 117024, total_players: 10539915}

  - name: selected_by_percent_string_is_staged_as_an_exact_decimal
    description: >
      FPL publishes ownership as a string. Staged as a decimal equal to the
      string, with no rounding loss at either end of the range. An empty
      string is NULL (M2).
    model: stg_player
    config:
      tags: [unit]
      meta:
        covers: "#140 AC2"
    given:
      - input: source('fpl_raw', 'bootstrap_static')
        format: sql
        rows: |
          select
              'tests/fixtures/raw/fpl/bootstrap-static/2026-09-14/20260914T211204Z-a730c3/payload.json' as filename,
              list_transform(
                  [(1, '31.2'), (2, '0.0'), (3, '100.0'), (4, '0.1'), (5, '')],
                  p -> {
                      'id': p[1]::bigint, 'web_name': 'Player', 'code': (1000 + p[1])::bigint,
                      'element_type': 3::bigint, 'total_points': 0::bigint,
                      'status': 'a',
                      'chance_of_playing_this_round': null::bigint,
                      'chance_of_playing_next_round': null::bigint,
                      'news': '', 'news_added': null::varchar,
                      'can_select': true, 'removed': false, 'team': 4::bigint,
                      'now_cost': 50::bigint, 'selected_by_percent': p[2],
                      'transfers_in_event': 0::bigint, 'transfers_out_event': 0::bigint
                  }
              ) as elements,
              10784294::bigint as total_players
      - input: ref('int_admitted_capture')
        rows:
          - {capture_key: "raw/fpl/bootstrap-static/2026-09-14/20260914T211204Z-a730c3/payload.json", season: "2026-27", run_id: "20260914T211204Z-a730c3"}
    expect:
      rows:
        - {fpl_id: 1, selected_by_percent: 31.2}
        - {fpl_id: 2, selected_by_percent: 0.0}
        - {fpl_id: 3, selected_by_percent: 100.0}
        - {fpl_id: 4, selected_by_percent: 0.1}
        - {fpl_id: 5, selected_by_percent: null}

  - name: unadmitted_capture_contributes_no_market_rows
    description: >
      Two bootstrap-static captures with different prices and total_players,
      only one of them admitted. Staging keeps the admitted capture's market
      row and total_players, and nothing from the other: neither its elements
      nor its root.
    model: stg_player
    config:
      tags: [unit]
      meta:
        covers: "#140 AC3"
    given:
      - input: source('fpl_raw', 'bootstrap_static')
        format: sql
        rows: |
          select * from (values
              ('tests/fixtures/raw/fpl/bootstrap-static/2026-09-14/20260914T211204Z-a730c3/payload.json', 80, 10784294),
              ('tests/fixtures/raw/fpl/bootstrap-static/2026-09-02/20260902T163935Z-07eb06/payload.json', 99, 1)
          ) as t(filename, cost, players),
          lateral (select [{
              'id': 7::bigint, 'web_name': 'Player', 'code': 1007::bigint,
              'element_type': 3::bigint, 'total_points': 12::bigint,
              'status': 'a',
              'chance_of_playing_this_round': null::bigint,
              'chance_of_playing_next_round': null::bigint,
              'news': '', 'news_added': null::varchar,
              'can_select': true, 'removed': false, 'team': 4::bigint,
              'now_cost': cost::bigint, 'selected_by_percent': '5.0',
              'transfers_in_event': 0::bigint, 'transfers_out_event': 0::bigint
          }] as elements, players::bigint as total_players)
      - input: ref('int_admitted_capture')
        rows:
          - {capture_key: "raw/fpl/bootstrap-static/2026-09-14/20260914T211204Z-a730c3/payload.json", season: "2026-27", run_id: "20260914T211204Z-a730c3"}
    expect:
      rows:
        - {run_id: "20260914T211204Z-a730c3", fpl_id: 7, now_cost: 80, total_players: 10784294}
