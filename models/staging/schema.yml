version: 2

models:
  - name: stg_player_history_capture
    description: >
      One row per admitted element-summary capture: its history[] array, kept
      to the fields declared at `$.history[*]`, and the array's entry count.
      The one read of the element-summary source; stg_player_fixture unnests
      from it (#175). Internal: not part of the served contract.
    group: warehouse_internal
    access: private
    columns:
      - name: capture_key
        description: >
          The capture's key in the capture index. Must exist in
          int_admitted_capture: staging holds admitted captures only (#104).
          Unique: a capture read both from compacted parquet and from the raw
          tail would stage twice (#194 B2).
        data_tests:
          - relationships:
              arguments:
                to: ref('int_admitted_capture')
                field: capture_key
              config:
                tags: [integration]
          - unique:
              config:
                tags: [integration]
                meta:
                  covers: '#194 AC2'

  - name: stg_player_fixture
    description: >
      1:1 with the element-summary `history` array — typing and renaming only.
      Carries every capture ever taken, including provisional and retracted
      rows; dedup is fct_player_fixture's job. Internal: not part of the
      served contract.
    group: warehouse_internal
    access: private
    columns:
      - name: capture_key
        description: >
          The capture's key in the capture index. Must exist in
          int_admitted_capture: staging holds admitted captures only (#104).
        data_tests:
          - relationships:
              arguments:
                to: ref('int_admitted_capture')
                field: capture_key
              config:
                tags: [integration]

  - name: stg_player
    description: >
      1:1 with bootstrap-static `elements`. Internal: not part of the served
      contract.
    group: warehouse_internal
    access: private
    data_tests:
      # One row per player per capture: the rows player status history is
      # built from (#125 AC1).
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, fpl_id, capture_key]
          config:
            tags: [unit]
            meta:
              covers: "#125 AC1"
    columns:
      - name: capture_key
        description: >
          The capture's key in the capture index. Must exist in
          int_admitted_capture: staging holds admitted captures only (#104).
        data_tests:
          - relationships:
              arguments:
                to: ref('int_admitted_capture')
                field: capture_key
              config:
                tags: [integration]
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#125 AC1"
      - name: season
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#125 AC1"
      - name: fpl_id
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#125 AC1"
      - name: player_code
        description: >
          FPL's cross-season player identifier (`elements[].code`). Carried
          only; never joined, deduplicated or filtered on.
        data_tests:
          - not_null:
              config:
                tags: [unit]
          # Never null and never changing across one player's captures within a
          # season (#69 AC5, AC6). Unlike not_null above, a failure names the
          # season and fpl_id, and the codes seen. Keyed by season because
          # fpl_id is reassigned each season.
          - constant_per_key:
              arguments:
                key: [season, fpl_id]
              config:
                tags: [unit]
                meta:
                  covers: "#69 AC6"
      - name: position_id
        data_tests:
          # Position is fixed within a season (decision 2 on #32): a player
          # whose captures in one season report two positions fails the build,
          # naming the season, fpl_id and both ids. Asserted here, not on
          # dim_player, because dim_player holds one row per player and cannot
          # see a change.
          - constant_per_key:
              arguments:
                key: [season, fpl_id]
              config:
                tags: [unit]
                meta:
                  covers: "#41 AC2"
      # The capture's player count, the ownership denominator. Capture-level,
      # so it is staged here and not served (#143 P3); its range and not-null
      # guards moved here from fct_player_market_snapshot with it (#141 E3).
      - name: total_players
        data_tests:
          - value_between:
              arguments: {min_value: 1}
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC2"
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC2"

  - name: stg_team
    description: >
      1:1 with bootstrap-static `teams` — one row per team per capture, typing
      and renaming only. `strength` is nullable and never coalesced. Internal:
      not part of the served contract.
    group: warehouse_internal
    access: private
    columns:
      - name: capture_key
        description: >
          The capture's key in the capture index. Must exist in
          int_admitted_capture: staging holds admitted captures only (#104).
        data_tests:
          - relationships:
              arguments:
                to: ref('int_admitted_capture')
                field: capture_key
              config:
                tags: [integration]
      - name: strength
        # Nullable by design, so no not_null test: FPL reports no strength for
        # any team in 2026-27 (decision 4 on #32). Where present it must sit on
        # FPL's 1-5 scale; anything outside it means the source changed.
        data_tests:
          - value_between:
              arguments:
                min_value: 1
                max_value: 5
              config:
                tags: [unit]
                meta:
                  covers: "#40 AC6"

  - name: stg_position
    description: >
      1:1 with bootstrap-static `element_types` — one row per position per
      capture, typing and renaming only. Internal: not part of the served
      contract.
    group: warehouse_internal
    access: private
    columns:
      - name: capture_key
        description: >
          The capture's key in the capture index. Must exist in
          int_admitted_capture: staging holds admitted captures only (#104).
        data_tests:
          - relationships:
              arguments:
                to: ref('int_admitted_capture')
                field: capture_key
              config:
                tags: [integration]

  - name: stg_fixture
    description: >
      1:1 with the fixtures endpoint — one row per fixture per capture, typing
      and renaming only. `round` and `kickoff_time` are null while a fixture is
      unscheduled or postponed and are never coalesced. `fixture_id` repeats
      every season, so it identifies a fixture only together with `season`.
      Choosing one capture per fixture is left downstream. Internal: not part
      of the served contract.
    group: warehouse_internal
    access: private
    data_tests:
      # dim_fixture_schedule_history orders a fixture's captures by
      # observed_at, and the as-of lookup takes the row opened last before a
      # moment; two captures of a fixture at the same instant would leave both
      # undefined, so a tie fails the build rather than resolving silently.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, fixture_id, observed_at]
          config:
            tags: [unit]
            meta:
              covers: "#152 AC8"
    columns:
      - name: capture_key
        description: >
          The capture's key in the capture index. Must exist in
          int_admitted_capture: staging holds admitted captures only (#104).
        data_tests:
          - relationships:
              arguments:
                to: ref('int_admitted_capture')
                field: capture_key
              config:
                tags: [integration]

  - name: stg_gameweek
    description: >
      1:1 with bootstrap-static `events` — the 38-gameweek calendar. Internal:
      not part of the served contract.
    group: warehouse_internal
    access: private
    columns:
      - name: capture_key
        description: >
          The capture's key in the capture index. Must exist in
          int_admitted_capture: staging holds admitted captures only (#104).
        data_tests:
          - relationships:
              arguments:
                to: ref('int_admitted_capture')
                field: capture_key
              config:
                tags: [integration]

  - name: stg_gameweek_status
    description: >
      1:1 with the event-status `status` array — one row per (gameweek,
      match_date) per capture, typing and renaming only. The gameweek-level
      rollup lives in int_gameweek_status. Internal: not part of the served contract.
    group: warehouse_internal
    access: private
    columns:
      - name: capture_key
        description: >
          The capture's key in the capture index. Must exist in
          int_admitted_capture: staging holds admitted captures only (#104).
        data_tests:
          - relationships:
              arguments:
                to: ref('int_admitted_capture')
                field: capture_key
              config:
                tags: [integration]

  - name: stg_run
    description: >
      One row per finalized ingest run (manifest status other than
      IN_PROGRESS), from every manifest under `_manifests/`, contract 1.0.0 to
      2.2.0. Typing only. The `origin_*` columns are the manifest's own
      `origin` object, null before contract 2.2.0. Internal.
    group: warehouse_internal
    access: private
    columns:
      - name: run_id
        data_tests:
          - unique:
              config:
                tags: [integration]
                meta:
                  covers: "#95 AC4"
          - not_null:
              config:
                tags: [integration]
                meta:
                  covers: "#95 AC4"
      - name: run_started_at
        data_tests:
          - not_null:
              config:
                tags: [integration]
                meta:
                  covers: "#95 AC4"
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["SUCCESS", "PARTIAL", "FAILED"]
              config:
                tags: [integration]
                meta:
                  covers: "#95 AC4"

  - name: base_capture_index
    description: >
      One row per indexed capture: the `captures[]` of every finalized
      manifest that carries them (2.1.0 and later), plus every entry of the
      backfill catalog (older runs and the ported history season). No
      admission logic. Internal.
    group: warehouse_internal
    access: private
    columns:
      - name: capture_key
        data_tests:
          - unique:
              config:
                tags: [integration]
                meta:
                  covers: "#95 AC1"
          - not_null:
              config:
                tags: [integration]
                meta:
                  covers: "#95 AC1"

  - name: stg_entry_picks_settlement
    description: >
      One row per picks settlement marker (GLOSSARY.md): fpl-ingest's
      `_settlement/entry-picks/<gameweek>/marker.json`, a published contract
      (#216 D2, fpl-ingest ADR 006). Its fields, unchanged (D3): event (as
      gameweek), entries, run_id, recorded_at. Its season is its run's (the
      key and body carry none). Not a capture, so it has no capture_key.
    group: warehouse_internal
    access: private
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, gameweek]
          config:
            tags: [unit]
            meta:
              covers: "#216 AC7"
    columns:
      - name: season
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#216 AC7"
      - name: entries
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#216 AC7"

  - name: stg_manager_panel
    description: >
      One row per (season, entry_id): a manager on the season's panel and
      their cohort (GLOSSARY.md), read from fpl-ingest's
      `_panels/<season>/manager-panel.json` with explicit columns (#216 D10,
      O5), a published contract like the marker (fpl-ingest#127 item 3). The
      panel's `joined_gw` is not read (D6). Not a capture, so it has no
      capture_key.
    group: warehouse_internal
    access: private
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, entry_id]
          config:
            tags: [unit]
            meta:
              covers: "#216 AC11"
    columns:
      - name: cohort
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#216 AC11"
          - accepted_values:
              arguments:
                values: ["random", "self"]
              config:
                tags: [unit]
                meta:
                  covers: "#216 AC11"

  - name: stg_entry_picks_capture
    description: >
      One row per admitted entry-picks capture (#216): the manager's chip,
      transfers, FPL's points, automatic subs and the 15 picks, typed. The one
      read of the entry-picks source; stg_entry_picks unnests from it.
      Internal: not part of the served contract.
    group: warehouse_internal
    access: private
    columns:
      - name: capture_key
        description: >
          The capture's key in the capture index. Must exist in
          int_admitted_capture: staging holds admitted captures only (#104).
          Unique: a capture read both from compacted parquet and from the raw
          tail would stage twice (#216 D8).
        data_tests:
          - relationships:
              arguments:
                to: ref('int_admitted_capture')
                field: capture_key
              config:
                tags: [integration]
          - unique:
              config:
                tags: [integration]
                meta:
                  covers: '#216 AC16'

  - name: stg_entry_picks
    description: >
      One row per pick (capture_key, slot): stg_entry_picks_capture's picks
      unnested (#216). Internal: not part of the served contract.
    group: warehouse_internal
    access: private
    columns:
      - name: capture_key
        data_tests:
          - relationships:
              arguments:
                to: ref('int_admitted_capture')
                field: capture_key
              config:
                tags: [integration]
