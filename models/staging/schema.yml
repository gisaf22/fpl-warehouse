version: 2

models:
  - name: stg_player_fixture
    description: >
      1:1 with the element-summary `history` array — typing and renaming only.
      Carries every capture ever taken, including provisional and retracted
      rows; dedup is fct_player_fixture's job. Internal: not part of the
      served contract.
    group: warehouse_internal
    access: private

  - name: stg_player
    description: >
      1:1 with bootstrap-static `elements`. Internal: not part of the served
      contract.
    group: warehouse_internal
    access: private
    columns:
      - name: player_code
        description: >
          FPL's cross-season player identifier (`elements[].code`). Carried
          only; never joined, deduplicated or filtered on.
        data_tests:
          - not_null:
              config:
                tags: [unit]

  - name: stg_team
    description: >
      1:1 with bootstrap-static `teams` — one row per team per capture, typing
      and renaming only. `strength` is nullable and never coalesced. Internal:
      not part of the served contract.
    group: warehouse_internal
    access: private
    columns:
      - name: strength
        # Nullable by design, so no not_null test: FPL reports no strength for
        # any team in 2026-27 (decision 4 on #32). Where present it must sit on
        # FPL's 1-5 scale; anything outside it means the source changed.
        data_tests:
          - value_between:
              arguments:
                min_value: 1
                max_value: 5
              config:
                tags: [unit]
                meta:
                  covers: "#40 AC6"

  - name: stg_position
    description: >
      1:1 with bootstrap-static `element_types` — one row per position per
      capture, typing and renaming only. Internal: not part of the served
      contract.
    group: warehouse_internal
    access: private

  - name: stg_fixture
    description: >
      1:1 with the fixtures endpoint — one row per fixture per capture, typing
      and renaming only. `round` and `kickoff_time` are null while a fixture is
      unscheduled or postponed and are never coalesced. `fixture_id` repeats
      every season, so it identifies a fixture only together with `season`.
      Choosing one capture per fixture is left downstream. Internal: not part
      of the served contract.
    group: warehouse_internal
    access: private

  - name: stg_gameweek
    description: >
      1:1 with bootstrap-static `events` — the 38-gameweek calendar. Internal:
      not part of the served contract.
    group: warehouse_internal
    access: private

  - name: stg_event_status
    description: >
      1:1 with the event-status `status` array — one row per (round, match_date)
      per capture, typing and renaming only. The round-level rollup lives in
      int_round_ratification. Internal: not part of the served contract.
    group: warehouse_internal
    access: private
