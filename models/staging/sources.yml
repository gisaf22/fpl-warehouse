version: 2

sources:
  - name: fpl_raw
    description: >
      fpl-ingest's verbatim raw capture tree. Objects are written under
      `{raw_root}/{source}/{endpoint}/{extraction_date}/{run_id}/payload.json`
      (see fpl_ingest.extract.http.raw_keys). `element-summary/{player_id}` is
      one endpoint identity per player, not an extra path level, so a player's
      captures live at `.../element-summary/{player_id}/{date}/{run_id}/`.

      Read in place rather than loaded — `external_location` points DuckDB's
      JSON reader at the raw objects, so nothing is copied into the warehouse.

      Where it points depends on the target. `dev` reads the live bucket via
      the `raw_root` var (overridable to a local capture when no AWS session is
      available). `fixtures` reads the checked-in capture under
      tests/fixtures/raw instead, so the unit and integration tiers build
      without credentials and without a ~26k-object production read — see
      tests/fixtures/build_fixtures.py for what that tree holds and why.

      Two trees, one relation. bootstrap-static and element-summary are read
      from the live tree AND from every ported history season under
      `history_root` (tests/fixtures/history under the `fixtures` target), in a
      single read_json over a list of globs rather than a UNION in staging — see
      the reason noted on those `external_location`s. Each row carries its own
      season, from the capture index via int_admitted_capture (#104); no model
      ever relates one season's rows to another's. Staging keeps only admitted
      captures, and takes each capture's metadata from the index: no model
      parses an object's path.

      event-status is live-only on purpose: the endpoint serves only the
      current round, so no capture of it exists for any closed season. A closed
      season's finality comes from the `closed_seasons` override in
      fct_player_fixture, checked against that season's own calendar.

      The switch is on `target.name` rather than on the var, so `--target
      fixtures` is a complete invocation: the target and the root it reads
      cannot be selected independently, and neither can be paired with the
      wrong one. The consequence is that `--vars '{raw_root: ...}'` has no
      effect under the `fixtures` target; it applies to `dev` only.

    tables:
      - name: element_summary
        description: >
          Per-player element-summary payload. Each object is one JSON document
          with three top-level keys: `fixtures` (upcoming), `history`
          (per-fixture rows for the season so far — the canonical
          player-gameweek source), and `history_past` (prior seasons).

          `filename = true` surfaces the object's own key. Staging turns it into
          the capture index's key (capture_key_from_filename) and joins
          int_admitted_capture, which supplies every capture column (#104):
          the payload body has no timestamp of its own.
        meta:
          endpoint: element-summary
          # One read over a list of globs: the live tree, plus each ported
          # history season. read_json's union_by_name absorbs the schema drift
          # between seasons, which a UNION of two sources in staging could not —
          # the payload struct types differ. Season comes from the capture
          # index (int_admitted_capture). An empty history_root yields the live glob
          # alone, so a build works before any season has been ported. Project
          # macros are not available when dbt renders source YAML, so the list is
          # spelled out here rather than built by one.
          external_location: >-
            read_json(
              [
                {% if target.name == "fixtures" %}
                'tests/fixtures/raw/fpl/element-summary/*/*/*/payload.json',
                'tests/fixtures/history/*/fpl/element-summary/*/*/*/payload.json'
                {% else %}
                '{{ var("raw_root") }}/fpl/element-summary/*/*/*/payload.json'
                {% if var("history_root") %}
                , '{{ var("history_root") }}/*/fpl/element-summary/*/*/*/payload.json'
                {% endif %}
                {% endif %}
              ],
              union_by_name = true,
              filename = true
            )
        columns:
          - name: history
          - name: history.assists
            meta:
              record_path: '$.history[*]'
          - name: history.bonus
            meta:
              record_path: '$.history[*]'
          - name: history.bps
            meta:
              record_path: '$.history[*]'
          - name: history.clean_sheets
            meta:
              record_path: '$.history[*]'
          - name: history.clearances_blocks_interceptions
            meta:
              record_path: '$.history[*]'
          - name: history.creativity
            meta:
              record_path: '$.history[*]'
          - name: history.defensive_contribution
            meta:
              record_path: '$.history[*]'
          - name: history.element
            meta:
              record_path: '$.history[*]'
          - name: history.expected_assists
            meta:
              record_path: '$.history[*]'
          - name: history.expected_goal_involvements
            meta:
              record_path: '$.history[*]'
          - name: history.expected_goals
            meta:
              record_path: '$.history[*]'
          - name: history.expected_goals_conceded
            meta:
              record_path: '$.history[*]'
          - name: history.fixture
            meta:
              record_path: '$.history[*]'
          - name: history.goals_conceded
            meta:
              record_path: '$.history[*]'
          - name: history.goals_scored
            meta:
              record_path: '$.history[*]'
          - name: history.ict_index
            meta:
              record_path: '$.history[*]'
          - name: history.influence
            meta:
              record_path: '$.history[*]'
          - name: history.kickoff_time
            meta:
              record_path: '$.history[*]'
          - name: history.minutes
            meta:
              record_path: '$.history[*]'
          - name: history.modified
            meta:
              record_path: '$.history[*]'
          - name: history.opponent_team
            meta:
              record_path: '$.history[*]'
          - name: history.own_goals
            meta:
              record_path: '$.history[*]'
          - name: history.penalties_missed
            meta:
              record_path: '$.history[*]'
          - name: history.penalties_saved
            meta:
              record_path: '$.history[*]'
          - name: history.recoveries
            meta:
              record_path: '$.history[*]'
          - name: history.red_cards
            meta:
              record_path: '$.history[*]'
          - name: history.round
            meta:
              record_path: '$.history[*]'
          - name: history.saves
            meta:
              record_path: '$.history[*]'
          - name: history.selected
            meta:
              record_path: '$.history[*]'
          - name: history.starts
            meta:
              record_path: '$.history[*]'
          - name: history.tackles
            meta:
              record_path: '$.history[*]'
          - name: history.team_a_score
            meta:
              record_path: '$.history[*]'
          - name: history.team_h_score
            meta:
              record_path: '$.history[*]'
          - name: history.threat
            meta:
              record_path: '$.history[*]'
          - name: history.total_points
            meta:
              record_path: '$.history[*]'
          - name: history.transfers_balance
            meta:
              record_path: '$.history[*]'
          - name: history.transfers_in
            meta:
              record_path: '$.history[*]'
          - name: history.transfers_out
            meta:
              record_path: '$.history[*]'
          - name: history.value
            meta:
              record_path: '$.history[*]'
          - name: history.was_home
            meta:
              record_path: '$.history[*]'
          - name: history.yellow_cards
            meta:
              record_path: '$.history[*]'
        data_tests:
          # Every declared column must still be a key in the latest admitted
          # live run (#114). Declaring a column above is enough to cover it.
          - consumed_keys_present:
              arguments:
                mode: removed
              config:
                severity: error
                tags: ['integration']
                meta: {covers: '#114 AC1'}
          - consumed_keys_present:
              arguments:
                mode: partial
              config:
                severity: warn
                tags: ['integration']
                meta: {covers: '#114 AC8'}

      - name: bootstrap_static
        description: >
          Whole-game reference payload. `elements` is the authoritative current
          player list and `events` the 38-gameweek calendar — together the
          basis of the player-gameweek spine, which must not be derived from
          which fixtures happened to be captured.

          One object per run, so all captures are read and the latest is
          selected downstream by the same `{extraction_date}/{run_id}` key
          fields used for element-summary.
        meta:
          endpoint: bootstrap-static
          # One read over a list of globs: the live tree, plus each ported
          # history season. read_json's union_by_name absorbs the schema drift
          # between seasons, which a UNION of two sources in staging could not —
          # the payload struct types differ. Season comes from the capture
          # index (int_admitted_capture). An empty history_root yields the live glob
          # alone, so a build works before any season has been ported. Project
          # macros are not available when dbt renders source YAML, so the list is
          # spelled out here rather than built by one.
          external_location: >-
            read_json(
              [
                {% if target.name == "fixtures" %}
                'tests/fixtures/raw/fpl/bootstrap-static/*/*/payload.json',
                'tests/fixtures/history/*/fpl/bootstrap-static/*/*/payload.json'
                {% else %}
                '{{ var("raw_root") }}/fpl/bootstrap-static/*/*/payload.json'
                {% if var("history_root") %}
                , '{{ var("history_root") }}/*/fpl/bootstrap-static/*/*/payload.json'
                {% endif %}
                {% endif %}
              ],
              union_by_name = true,
              filename = true
            )
        columns:
          - name: elements
          - name: events
          - name: teams
          - name: element_types
          # Player market snapshot (#139): the game's player count, the
          # ownership denominator, carried per capture. A root scalar, so it has
          # no record_path.
          - name: total_players
          - name: elements.id
            meta:
              record_path: '$.elements[*]'
          - name: elements.code
            meta:
              record_path: '$.elements[*]'
          - name: elements.element_type
            meta:
              record_path: '$.elements[*]'
          - name: elements.web_name
            meta:
              record_path: '$.elements[*]'
          - name: elements.total_points
            meta:
              record_path: '$.elements[*]'
          # Player status history (#123): availability, news and listed club
          # as of each capture. code and element_type above are its other
          # fields.
          - name: elements.status
            meta:
              record_path: '$.elements[*]'
          - name: elements.chance_of_playing_this_round
            meta:
              record_path: '$.elements[*]'
          - name: elements.chance_of_playing_next_round
            meta:
              record_path: '$.elements[*]'
          - name: elements.news
            meta:
              record_path: '$.elements[*]'
          - name: elements.news_added
            meta:
              record_path: '$.elements[*]'
          - name: elements.can_select
            meta:
              record_path: '$.elements[*]'
          - name: elements.removed
            meta:
              record_path: '$.elements[*]'
          - name: elements.team
            meta:
              record_path: '$.elements[*]'
          # Player market snapshot (#139): price, ownership and the gameweek's
          # transfer flow as of each capture, as the source gives them.
          - name: elements.now_cost
            meta:
              record_path: '$.elements[*]'
          - name: elements.selected_by_percent
            meta:
              record_path: '$.elements[*]'
          - name: elements.transfers_in_event
            meta:
              record_path: '$.elements[*]'
          - name: elements.transfers_out_event
            meta:
              record_path: '$.elements[*]'
          - name: events.id
            meta:
              record_path: '$.events[*]'
          - name: events.deadline_time
            meta:
              record_path: '$.events[*]'
          - name: events.finished
            meta:
              record_path: '$.events[*]'
          - name: events.is_current
            meta:
              record_path: '$.events[*]'
          - name: events.data_checked
            meta:
              record_path: '$.events[*]'
          - name: teams.id
            meta:
              record_path: '$.teams[*]'
          - name: teams.code
            meta:
              record_path: '$.teams[*]'
          - name: teams.name
            meta:
              record_path: '$.teams[*]'
          - name: teams.short_name
            meta:
              record_path: '$.teams[*]'
          - name: teams.strength
            meta:
              record_path: '$.teams[*]'
          - name: element_types.id
            meta:
              record_path: '$.element_types[*]'
          - name: element_types.singular_name
            meta:
              record_path: '$.element_types[*]'
          - name: element_types.singular_name_short
            meta:
              record_path: '$.element_types[*]'
        data_tests:
          # Every declared column must still be a key in the latest admitted
          # live run (#114). Declaring a column above is enough to cover it.
          - consumed_keys_present:
              arguments:
                mode: removed
              config:
                severity: error
                tags: ['integration']
                meta: {covers: '#114 AC1'}
          - consumed_keys_present:
              arguments:
                mode: partial
              config:
                severity: warn
                tags: ['integration']
                meta: {covers: '#114 AC8'}

      - name: fixtures
        description: >
          The season's fixture list — one JSON array per capture, one element
          per fixture, with `event` (the round), `team_h` / `team_a`, scores,
          difficulty and per-fixture `stats`. Read here so fixture context and
          team per fixture can be resolved from the source rather than from
          bootstrap's current-state view.

          Captured on the same `{extraction_date}/{run_id}` layout as
          bootstrap-static, so every capture is read and staging takes its
          capture identity from the index the same way. The ported 2025-26 season carries
          one end-of-season snapshot (see
          scripts/rekey_history_season.py, which maps the archive's
          `fixtures.json` to this endpoint).
        meta:
          endpoint: fixtures
          # Same list-of-globs shape as bootstrap-static above, for the same
          # reasons.
          external_location: >-
            read_json(
              [
                {% if target.name == "fixtures" %}
                'tests/fixtures/raw/fpl/fixtures/*/*/payload.json',
                'tests/fixtures/history/*/fpl/fixtures/*/*/payload.json'
                {% else %}
                '{{ var("raw_root") }}/fpl/fixtures/*/*/payload.json'
                {% if var("history_root") %}
                , '{{ var("history_root") }}/*/fpl/fixtures/*/*/payload.json'
                {% endif %}
                {% endif %}
              ],
              union_by_name = true,
              filename = true
            )
        columns:
          - name: id
            meta:
              record_path: '$[*]'
          - name: event
            meta:
              record_path: '$[*]'
          - name: kickoff_time
            meta:
              record_path: '$[*]'
          - name: team_h
            meta:
              record_path: '$[*]'
          - name: team_a
            meta:
              record_path: '$[*]'
          - name: team_h_score
            meta:
              record_path: '$[*]'
          - name: team_a_score
            meta:
              record_path: '$[*]'
          - name: finished
            meta:
              record_path: '$[*]'
          - name: team_h_difficulty
            meta:
              record_path: '$[*]'
          - name: team_a_difficulty
            meta:
              record_path: '$[*]'
        data_tests:
          # Every declared column must still be a key in the latest admitted
          # live run (#114). Declaring a column above is enough to cover it.
          - consumed_keys_present:
              arguments:
                mode: removed
              config:
                severity: error
                tags: ['integration']
                meta: {covers: '#114 AC1'}
          - consumed_keys_present:
              arguments:
                mode: partial
              config:
                severity: warn
                tags: ['integration']
                meta: {covers: '#114 AC8'}

      - name: event_status
        description: >
          FPL's authoritative points-finality signal — the source of truth for
          whether a round's scores are ratified, replacing the per-fixture
          score-non-null inference the served layer used previously.

          The payload is `{"status": [...], "leagues": "..."}`. `status` is one
          row per (event, match-date), NOT one per round: a round spanning
          three match days contributes three entries, and a round mid-transition
          carries a mix of `points` values across them. Round-level finality is
          therefore an aggregate, built in int_gameweek_status — see that
          model for the rule.

          `status[].points` is a string with three observed values: `"r"`
          (ratified), `"p"` (provisional) and `""` (empty, seen alongside `"p"`
          while a round is in progress). `status[].bonus_added` is the boolean
          companion. `leagues` is a top-level string (`""` / `"Updated"`) with
          no per-round meaning and is not read.

          Only the *current* round's dates are served — a finished round rolls
          out of the window entirely. Every capture ever taken is read here
          precisely so that finished rounds survive as history; the latest
          object alone would report nothing about rounds already settled.

          One object per run, same `{extraction_date}/{run_id}` key layout as
          bootstrap-static, parsed the same way in staging.
        meta:
          endpoint: event-status
          external_location: >-
            read_json(
              '{{ "tests/fixtures/raw" if target.name == "fixtures" else var("raw_root") }}/fpl/event-status/*/*/payload.json',
              union_by_name = true,
              filename = true
            )
        columns:
          - name: status
          - name: status.event
            meta:
              record_path: '$.status[*]'
          - name: status.date
            meta:
              record_path: '$.status[*]'
          - name: status.points
            meta:
              record_path: '$.status[*]'
          - name: status.bonus_added
            meta:
              record_path: '$.status[*]'
        data_tests:
          # Every declared column must still be a key in the latest admitted
          # live run (#114). Declaring a column above is enough to cover it.
          - consumed_keys_present:
              arguments:
                mode: removed
              config:
                severity: error
                tags: ['integration']
                meta: {covers: '#114 AC1'}
          - consumed_keys_present:
              arguments:
                mode: partial
              config:
                severity: warn
                tags: ['integration']
                meta: {covers: '#114 AC8'}

      - name: run_manifests
        description: >
          fpl-ingest's run manifest, one object per run at
          `_manifests/{extraction_date}/{run_id}/manifest.json`, contract
          1.0.0 to 2.2.0. Read with explicit columns so every version yields the
          same shape: a field a version lacks (`trigger` before 2026-09-24,
          `origin` before 2.2.0, `captures` before 2.1.0 and on any
          IN_PROGRESS manifest) reads as null. Live tree only: the ported
          history season has no manifest (#87 D3).
        meta:
          external_location: >-
            read_json(
              '{{ "tests/fixtures/raw" if target.name == "fixtures" else var("raw_root") }}/fpl/_manifests/*/*/manifest.json',
              columns = struct_pack(
                raw_contract_version := 'VARCHAR',
                run_id := 'VARCHAR',
                extraction_date := 'VARCHAR',
                status := 'VARCHAR',
                started_at := 'VARCHAR',
                ended_at := 'VARCHAR',
                trigger := 'VARCHAR',
                origin := 'STRUCT(kind VARCHAR, workflow VARCHAR, ref VARCHAR, github_run_id VARCHAR, aws_principal VARCHAR)',
                captures := 'STRUCT(key VARCHAR, endpoint VARCHAR, received_at VARCHAR, content_sha256 VARCHAR, content_length BIGINT, http_status INTEGER, shape_ok BOOLEAN, usable BOOLEAN, season VARCHAR)[]'
              ),
              filename = true
            )

      - name: backfill_catalog
        description: >
          fpl-ingest's backfill catalog (gisaf22/fpl-ingest#66), one file per
          run older than contract 2.1.0 at `_catalog/backfill/{run_id}.json`,
          listing every capture that run wrote with its shape verdict and
          season. Covers the live tree and the ported history season (`scope`
          `live` / `history`); both files sit under the live raw root.
        meta:
          external_location: >-
            read_json(
              '{{ "tests/fixtures/raw" if target.name == "fixtures" else var("raw_root") }}/fpl/_catalog/backfill/*.json',
              columns = struct_pack(
                run_id := 'VARCHAR',
                scope := 'VARCHAR',
                captures := 'STRUCT(key VARCHAR, endpoint VARCHAR, received_at VARCHAR, content_sha256 VARCHAR, content_length BIGINT, http_status INTEGER, shape_ok BOOLEAN, usable BOOLEAN, season VARCHAR, shape_source VARCHAR, validator_version VARCHAR)[]'
              ),
              filename = true
            )
