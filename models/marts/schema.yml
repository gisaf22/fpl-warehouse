version: 2

# Generic tests carry the `unit` tier tag explicitly rather than inheriting a
# project-level default: dbt *merges* tag configs rather than overriding them,
# so a `data_tests: +tags: [unit]` default in dbt_project.yml would also stamp
# `unit` onto the integration and e2e singular tests and break tier selection.
# The tag block is written once as a YAML anchor and aliased thereafter.
#
# The not_null coverage below is the ported form of two of the retired SQL
# assertions — see the triage in commit "refactor(tests): delete dead Python
# suite, move dbt tests to tests/":
#   tests/availability/sql/fact_test_keys_not_null.sql      -> the grain columns
#   tests/availability/sql/fact_test_column_coverage.sql    -> the COALESCEd measures
# Their team_fpl_id clause is deliberately not carried: this warehouse holds no
# team identifier, because resolving one at build time is the as-of bug the
# rebuild exists to remove.

models:
  - name: fct_player_fixture
    description: >
      The canonical per-fixture player fact: one row per
      (season, fpl_id, fixture_id), deduplicated to the ratified capture. Part
      of the served contract consumed by fpl-intelligence — the column list
      below is enforced, so any change to it is a breaking change for
      consumers and must be made deliberately.
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    # Every fact row's fixture exists in dim_fixture within its own season.
    # relationships takes one column on each side and the key is two, so both
    # sides are the same season-qualified expression, as in dim_team's unique
    # test. A fixture_id matching only another season's fixture fails.
    data_tests:
      - relationships:
          column_name: "season || '|' || fixture_id"
          arguments:
            to: ref('dim_fixture')
            field: "season || '|' || fixture_id"
          config:
            tags: [integration]
            meta:
              covers: "#42 AC6"
    columns:
      - name: season
        data_type: VARCHAR
        data_tests: &unit_not_null
          - not_null:
              config:
                tags: [unit]
      - name: extraction_date
        data_type: DATE
      - name: run_id
        data_type: VARCHAR
      - name: extracted_at
        data_type: TIMESTAMP
      - name: fpl_id
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: fixture_id
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: round
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: opponent_team_fpl_id
        data_type: INTEGER
      - name: was_home
        data_type: BOOLEAN
      - name: kickoff_time
        data_type: TIMESTAMP
      - name: team_h_score
        data_type: INTEGER
      - name: team_a_score
        data_type: INTEGER
      - name: minutes
        data_type: INTEGER
        # The one schema.yml use of value_between inside #53, so dbt's YAML
        # argument path is exercised and not only the singular tests' direct
        # calls. min alone: the 90-minute ceiling is asserted separately by
        # tests/fct_test_player_fixture_minutes_within_match_length.sql.
        data_tests:
          - value_between:
              arguments:
                min_value: 0
              config:
                tags: [unit]
                meta:
                  covers: "#53 AC4"
      - name: starts
        data_type: INTEGER
      - name: total_points
        data_type: INTEGER
      - name: bonus
        data_type: INTEGER
      - name: bps
        data_type: INTEGER
      - name: goals_scored
        data_type: INTEGER
      - name: assists
        data_type: INTEGER
      - name: clean_sheets
        data_type: INTEGER
      - name: goals_conceded
        data_type: INTEGER
      - name: own_goals
        data_type: INTEGER
      - name: penalties_saved
        data_type: INTEGER
      - name: penalties_missed
        data_type: INTEGER
      - name: yellow_cards
        data_type: INTEGER
      - name: red_cards
        data_type: INTEGER
      - name: saves
        data_type: INTEGER
      - name: clearances_blocks_interceptions
        data_type: INTEGER
      - name: recoveries
        data_type: INTEGER
      - name: tackles
        data_type: INTEGER
      - name: defensive_contribution
        data_type: INTEGER
      - name: expected_goals
        data_type: DOUBLE
      - name: expected_assists
        data_type: DOUBLE
      - name: expected_goal_involvements
        data_type: DOUBLE
      - name: expected_goals_conceded
        data_type: DOUBLE
      - name: influence
        data_type: DOUBLE
      - name: creativity
        data_type: DOUBLE
      - name: threat
        data_type: DOUBLE
      - name: ict_index
        data_type: DOUBLE
      - name: value
        data_type: INTEGER
      - name: selected
        data_type: INTEGER
      - name: transfers_in
        data_type: INTEGER
      - name: transfers_out
        data_type: INTEGER
      - name: transfers_balance
        data_type: INTEGER
      - name: modified
        data_type: BOOLEAN
      - name: is_ratified
        data_type: BOOLEAN

  - name: fct_player_gameweek
    description: >
      Player-gameweek aggregate: one row per (season, fpl_id, round),
      one-for-one with the gameweek spine so blanks are present with
      fixture_count 0. Part of the served contract consumed by
      fpl-intelligence — the column list below is enforced, so any change to
      it is a breaking change for consumers and must be made deliberately.
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: season
        data_type: VARCHAR
        data_tests: *unit_not_null
      - name: fpl_id
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: round
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: web_name
        data_type: VARCHAR
        data_tests: *unit_not_null
      - name: deadline_time
        data_type: TIMESTAMP
        data_tests: *unit_not_null
      - name: fixture_count
        data_type: INTEGER
        data_tests: *unit_not_null
      # Legitimately NULL for a blank gameweek — no fixture states them — so
      # they are excluded from the not_null sweep below, which exists to catch
      # a COALESCE being dropped from the additive measures.
      - name: first_kickoff_time
        data_type: TIMESTAMP
      - name: last_kickoff_time
        data_type: TIMESTAMP
      - name: is_ratified
        data_type: BOOLEAN
      - name: minutes
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: starts
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: total_points
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: bonus
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: bps
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: goals_scored
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: assists
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: clean_sheets
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: goals_conceded
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: own_goals
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: penalties_saved
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: penalties_missed
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: yellow_cards
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: red_cards
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: saves
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: clearances_blocks_interceptions
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: recoveries
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: tackles
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: defensive_contribution
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: expected_goals
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: expected_assists
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: expected_goal_involvements
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: expected_goals_conceded
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: influence
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: creativity
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: threat
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: ict_index
        data_type: DOUBLE
        data_tests: *unit_not_null
      # Event-level, taken from the round's last fixture, so NULL for a blank
      # gameweek for the same reason as the kickoff times above.
      - name: value
        data_type: INTEGER
      - name: selected
        data_type: INTEGER
      - name: transfers_in
        data_type: INTEGER
      - name: transfers_out
        data_type: INTEGER
      - name: transfers_balance
        data_type: INTEGER


  - name: dim_team
    description: >
      One row per team per season, keyed (season, team_fpl_id), taken from that
      season's latest bootstrap-static capture. A club present in two seasons
      is two rows sharing team_code, never merged — team_fpl_id is reassigned
      every season. `strength` is staged, not carried here (decision 4 on
      #32). Internal until the dimensions are served (#34, B5).
    group: warehouse_internal
    access: private
    # The grain as one expression: dbt's unique test takes a single column, and
    # the key is two. A null in either half nulls the expression, which unique
    # skips — the per-column not_null tests below close that gap.
    data_tests:
      - unique:
          column_name: "season || '|' || team_fpl_id"
          config:
            tags: [unit]
            meta:
              covers: "#40 AC3"
    columns:
      - name: season
        data_tests: &dim_team_key_not_null
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#40 AC3"
      - name: team_fpl_id
        data_tests: *dim_team_key_not_null
      - name: team_code
      - name: team_name
      - name: team_short_name

  - name: dim_fixture
    description: >
      One row per fixture per season, keyed (season, fixture_id). Teams, round,
      kickoff and result come from the fixture's latest capture. Difficulty
      comes from the last capture before kickoff, and
      difficulty_is_pre_kickoff says whether one existed: false for all of
      2025-26 (one end-of-season snapshot) and for live fixtures that kicked
      off before capture history began (decision 3 on #32). A double round has
      more than 10 fixtures and a team playing twice; a blank round has fewer
      than 10. Nothing here assumes either count. Internal until the
      dimensions are served (#34, B5).
    group: warehouse_internal
    access: private
    # The grain as one expression, as in dim_team: a null in either half nulls
    # the expression, which unique skips, so the key columns are also not_null.
    data_tests:
      - unique:
          column_name: "season || '|' || fixture_id"
          config:
            tags: [unit]
            meta:
              covers: "#42 AC1"
      # Both sides resolve within the fixture's own season. relationships
      # skips a null from-value, and a team id is never null here: stg_fixture
      # stages both sides from every fixture object.
      - relationships:
          column_name: "season || '|' || team_h_fpl_id"
          arguments:
            to: ref('dim_team')
            field: "season || '|' || team_fpl_id"
          config: &dim_fixture_team_resolves
            tags: [integration]
            meta:
              covers: "#42 AC2"
      - relationships:
          column_name: "season || '|' || team_a_fpl_id"
          arguments:
            to: ref('dim_team')
            field: "season || '|' || team_fpl_id"
          config: *dim_fixture_team_resolves
    columns:
      - name: season
        data_tests: &dim_fixture_key_not_null
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#42 AC1"
      - name: fixture_id
        data_tests: *dim_fixture_key_not_null
      - name: round
        description: >
          Nullable, no not_null test: null for a fixture FPL has not scheduled
          (postponed, or not yet given a date). Such a fixture is still one of
          the season's fixtures and is kept.
        data_tests:
          - value_between:
              arguments: {min_value: 1, max_value: 38}
              config: &dim_fixture_in_range
                tags: [unit]
                meta:
                  covers: "#42 AC7"
      - name: kickoff_time
        description: >
          Nullable, no not_null test: null for a fixture FPL has not scheduled,
          for the same reason as round.
      - name: team_h_fpl_id
      - name: team_a_fpl_id
      - name: team_h_score
        description: >
          Nullable, no not_null test: null until the fixture is played. Taken
          from the latest capture, so it is the final score once there is one.
        data_tests:
          - value_between:
              arguments: {min_value: 0}
              config: *dim_fixture_in_range
      - name: team_a_score
        description: Nullable, no not_null test, for the same reason as team_h_score.
        data_tests:
          - value_between:
              arguments: {min_value: 0}
              config: *dim_fixture_in_range
      - name: finished
      - name: team_h_difficulty
        data_tests: &dim_fixture_difficulty
          - not_null:
              config:
                tags: [integration]
                meta:
                  covers: "#42 AC4"
          - value_between:
              arguments: {min_value: 1, max_value: 5}
              config: *dim_fixture_in_range
      - name: team_a_difficulty
        data_tests: *dim_fixture_difficulty
      - name: difficulty_is_pre_kickoff
        data_tests:
          - not_null:
              config: &dim_fixture_flag_defined
                tags: [unit]
                meta:
                  covers: "#42 AC5"
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
              config: *dim_fixture_flag_defined
