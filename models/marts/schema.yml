version: 2

# Generic tests carry the `unit` tier tag explicitly rather than inheriting a
# project-level default: dbt *merges* tag configs rather than overriding them,
# so a `data_tests: +tags: [unit]` default in dbt_project.yml would also stamp
# `unit` onto the integration and e2e singular tests and break tier selection.
# The tag block is written once as a YAML anchor and aliased thereafter.
#
# The not_null coverage below is the ported form of two of the retired SQL
# assertions — see the triage in commit "refactor(tests): delete dead Python
# suite, move dbt tests to tests/":
#   tests/availability/sql/fact_test_keys_not_null.sql      -> the grain columns
#   tests/availability/sql/fact_test_column_coverage.sql    -> the COALESCEd measures
# Their team_fpl_id clause was not carried at the time, because resolving a team
# at build time is the as-of bug the rebuild exists to remove. fct_player_fixture
# now carries team_fpl_id resolved per fixture (#43), with its own not_null test.

models:
  - name: fct_player_fixture
    description: >
      The canonical per-fixture player fact: one row per
      (season, fpl_id, fixture_id), deduplicated to the ratified capture. Part
      of the served contract consumed by fpl-intelligence — the column list
      below is enforced, so any change to it is a breaking change for
      consumers and must be made deliberately.
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    # Every fact row's fixture exists in dim_fixture within its own season.
    # relationships takes one column on each side and the key is two, so both
    # sides are the same season-qualified expression, as in dim_team's unique
    # test. A fixture_id matching only another season's fixture fails.
    data_tests:
      - relationships:
          column_name: "season || '|' || fixture_id"
          arguments:
            to: ref('dim_fixture')
            field: "season || '|' || fixture_id"
          config:
            tags: [integration]
            meta:
              covers: "#42 AC6"
      # Every row's team is a club in dim_team within its own season, matched
      # on the same season-qualified expression.
      - relationships:
          column_name: "season || '|' || team_fpl_id"
          arguments:
            to: ref('dim_team')
            field: "season || '|' || team_fpl_id"
          config:
            tags: [integration]
            meta:
              covers: "#43 AC4"
      # Every row's player is in dim_player within its own season.
      - relationships:
          column_name: "season || '|' || fpl_id"
          arguments:
            to: ref('dim_player')
            field: "season || '|' || fpl_id"
          config:
            tags: [integration]
            meta:
              covers: "#41 AC5"
    columns:
      - name: season
        data_type: VARCHAR
        data_tests: &unit_not_null
          - not_null:
              config:
                tags: [unit]
      - name: extraction_date
        data_type: DATE
      - name: run_id
        data_type: VARCHAR
      - name: extracted_at
        data_type: TIMESTAMP
      - name: fpl_id
        data_type: INTEGER
        description: "{{ doc('season_scoped_key') }}"
        data_tests: *unit_not_null
      - name: fixture_id
        data_type: INTEGER
        description: "{{ doc('season_scoped_key') }}"
        data_tests: *unit_not_null
      - name: gameweek
        data_type: INTEGER
        description: "{{ doc('season_scoped_key') }}"
        data_tests: *unit_not_null
      - name: opponent_team_fpl_id
        data_type: INTEGER
        description: "{{ doc('season_scoped_key') }}"
      - name: was_home
        data_type: BOOLEAN
      - name: kickoff_time
        data_type: TIMESTAMP
      - name: team_h_score
        data_type: INTEGER
      - name: team_a_score
        data_type: INTEGER
      - name: minutes
        data_type: INTEGER
        # The one schema.yml use of value_between inside #53, so dbt's YAML
        # argument path is exercised and not only the singular tests' direct
        # calls. min alone: the 90-minute ceiling is asserted separately by
        # tests/fct_test_player_fixture_minutes_within_match_length.sql.
        data_tests:
          - value_between:
              arguments:
                min_value: 0
              config:
                tags: [unit]
                meta:
                  covers: "#53 AC4"
      - name: starts
        data_type: INTEGER
      - name: total_points
        data_type: INTEGER
      - name: bonus
        data_type: INTEGER
      - name: bps
        data_type: INTEGER
      - name: goals_scored
        data_type: INTEGER
      - name: assists
        data_type: INTEGER
      - name: clean_sheets
        data_type: INTEGER
      - name: goals_conceded
        data_type: INTEGER
      - name: own_goals
        data_type: INTEGER
      - name: penalties_saved
        data_type: INTEGER
      - name: penalties_missed
        data_type: INTEGER
      - name: yellow_cards
        data_type: INTEGER
      - name: red_cards
        data_type: INTEGER
      - name: saves
        data_type: INTEGER
      - name: clearances_blocks_interceptions
        data_type: INTEGER
      - name: recoveries
        data_type: INTEGER
      - name: tackles
        data_type: INTEGER
      - name: defensive_contribution
        data_type: INTEGER
      - name: expected_goals
        data_type: DOUBLE
      - name: expected_assists
        data_type: DOUBLE
      - name: expected_goal_involvements
        data_type: DOUBLE
      - name: expected_goals_conceded
        data_type: DOUBLE
      - name: influence
        data_type: DOUBLE
      - name: creativity
        data_type: DOUBLE
      - name: threat
        data_type: DOUBLE
      - name: ict_index
        data_type: DOUBLE
