version: 2

models:
  - name: fct_player_fixture
    description: >
      The canonical per-fixture player fact: one row per
      (season, fpl_id, fixture_id), deduplicated to the ratified capture. Part
      of the served contract consumed by fpl-intelligence — the column list
      below is enforced, so any change to it is a breaking change for
      consumers and must be made deliberately.
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: season
        data_type: VARCHAR
      - name: extraction_date
        data_type: DATE
      - name: run_id
        data_type: VARCHAR
      - name: extracted_at
        data_type: TIMESTAMP
      - name: fpl_id
        data_type: INTEGER
      - name: fixture_id
        data_type: INTEGER
      - name: round
        data_type: INTEGER
      - name: opponent_team_fpl_id
        data_type: INTEGER
      - name: was_home
        data_type: BOOLEAN
      - name: kickoff_time
        data_type: TIMESTAMP
      - name: team_h_score
        data_type: INTEGER
      - name: team_a_score
        data_type: INTEGER
      - name: minutes
        data_type: INTEGER
      - name: starts
        data_type: INTEGER
      - name: total_points
        data_type: INTEGER
      - name: bonus
        data_type: INTEGER
      - name: bps
        data_type: INTEGER
      - name: goals_scored
        data_type: INTEGER
      - name: assists
        data_type: INTEGER
      - name: clean_sheets
        data_type: INTEGER
      - name: goals_conceded
        data_type: INTEGER
      - name: own_goals
        data_type: INTEGER
      - name: penalties_saved
        data_type: INTEGER
      - name: penalties_missed
        data_type: INTEGER
      - name: yellow_cards
        data_type: INTEGER
      - name: red_cards
        data_type: INTEGER
      - name: saves
        data_type: INTEGER
      - name: clearances_blocks_interceptions
        data_type: INTEGER
      - name: recoveries
        data_type: INTEGER
      - name: tackles
        data_type: INTEGER
      - name: defensive_contribution
        data_type: INTEGER
      - name: expected_goals
        data_type: DOUBLE
      - name: expected_assists
        data_type: DOUBLE
      - name: expected_goal_involvements
        data_type: DOUBLE
      - name: expected_goals_conceded
        data_type: DOUBLE
      - name: influence
        data_type: DOUBLE
      - name: creativity
        data_type: DOUBLE
      - name: threat
        data_type: DOUBLE
      - name: ict_index
        data_type: DOUBLE
      - name: value
        data_type: INTEGER
      - name: selected
        data_type: INTEGER
      - name: transfers_in
        data_type: INTEGER
      - name: transfers_out
        data_type: INTEGER
      - name: transfers_balance
        data_type: INTEGER
      - name: modified
        data_type: BOOLEAN
      - name: is_ratified
        data_type: BOOLEAN

  - name: fct_player_gameweek
    description: >
      Player-gameweek aggregate: one row per (season, fpl_id, round),
      one-for-one with the gameweek spine so blanks are present with
      fixture_count 0. Part of the served contract consumed by
      fpl-intelligence — the column list below is enforced, so any change to
      it is a breaking change for consumers and must be made deliberately.
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    columns:
