    description: >
      Player-gameweek aggregate: one row per (season, fpl_id, gameweek),
      one-for-one with the gameweek spine so blanks are present with
      fixture_count 0. Part of the served contract consumed by
      fpl-intelligence — the column list below is enforced, so any change to
      it is a breaking change for consumers and must be made deliberately.

      **value, selected and transfers_* are per gameweek**, from the player's
      element-summary history rows (the gameweek's last fixture, see CLAUDE.md
      "Grain"). The market as it stood at a given capture, before a deadline,
      is fct_player_market_snapshot: per capture, from bootstrap-static (#138
      M4). The two are different measurements; slice 2 (#133) removes these
      columns from this table.
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: season
        data_type: VARCHAR
        data_tests: *unit_not_null
      - name: fpl_id
        data_type: INTEGER
