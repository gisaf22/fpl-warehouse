version: 2

# Generic tests carry the `unit` tier tag explicitly rather than inheriting a
# project-level default: dbt *merges* tag configs rather than overriding them,
# so a `data_tests: +tags: [unit]` default in dbt_project.yml would also stamp
# `unit` onto the integration and e2e singular tests and break tier selection.
# The tag block is written once as a YAML anchor and aliased thereafter.
#
# The not_null coverage below is the ported form of two of the retired SQL
# assertions — see the triage in commit "refactor(tests): delete dead Python
# suite, move dbt tests to tests/":
#   tests/availability/sql/fact_test_keys_not_null.sql      -> the grain columns
#   tests/availability/sql/fact_test_column_coverage.sql    -> the COALESCEd measures
# Their team_fpl_id clause is deliberately not carried: this warehouse holds no
# team identifier, because resolving one at build time is the as-of bug the
# rebuild exists to remove.

models:
  - name: fct_player_fixture
    description: >
      The canonical per-fixture player fact: one row per
      (season, fpl_id, fixture_id), deduplicated to the ratified capture. Part
      of the served contract consumed by fpl-intelligence — the column list
      below is enforced, so any change to it is a breaking change for
      consumers and must be made deliberately.
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: season
        data_type: VARCHAR
        data_tests: &unit_not_null
          - not_null:
              config:
                tags: [unit]
      - name: extraction_date
        data_type: DATE
      - name: run_id
        data_type: VARCHAR
      - name: extracted_at
        data_type: TIMESTAMP
      - name: fpl_id
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: fixture_id
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: round
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: opponent_team_fpl_id
        data_type: INTEGER
      - name: was_home
        data_type: BOOLEAN
      - name: kickoff_time
        data_type: TIMESTAMP
      - name: team_h_score
        data_type: INTEGER
      - name: team_a_score
        data_type: INTEGER
      - name: minutes
        data_type: INTEGER
      - name: starts
        data_type: INTEGER
      - name: total_points
        data_type: INTEGER
      - name: bonus
        data_type: INTEGER
      - name: bps
        data_type: INTEGER
      - name: goals_scored
        data_type: INTEGER
      - name: assists
        data_type: INTEGER
      - name: clean_sheets
        data_type: INTEGER
      - name: goals_conceded
        data_type: INTEGER
      - name: own_goals
        data_type: INTEGER
      - name: penalties_saved
        data_type: INTEGER
      - name: penalties_missed
        data_type: INTEGER
      - name: yellow_cards
        data_type: INTEGER
      - name: red_cards
        data_type: INTEGER
      - name: saves
        data_type: INTEGER
      - name: clearances_blocks_interceptions
        data_type: INTEGER
      - name: recoveries
        data_type: INTEGER
      - name: tackles
        data_type: INTEGER
      - name: defensive_contribution
        data_type: INTEGER
      - name: expected_goals
        data_type: DOUBLE
      - name: expected_assists
        data_type: DOUBLE
      - name: expected_goal_involvements
        data_type: DOUBLE
      - name: expected_goals_conceded
        data_type: DOUBLE
      - name: influence
        data_type: DOUBLE
      - name: creativity
        data_type: DOUBLE
      - name: threat
        data_type: DOUBLE
      - name: ict_index
        data_type: DOUBLE
      - name: value
        data_type: INTEGER
      - name: selected
        data_type: INTEGER
      - name: transfers_in
        data_type: INTEGER
      - name: transfers_out
        data_type: INTEGER
      - name: transfers_balance
        data_type: INTEGER
      - name: modified
        data_type: BOOLEAN
      - name: is_ratified
        data_type: BOOLEAN

  - name: fct_player_gameweek
    description: >
      Player-gameweek aggregate: one row per (season, fpl_id, round),
      one-for-one with the gameweek spine so blanks are present with
      fixture_count 0. Part of the served contract consumed by
      fpl-intelligence — the column list below is enforced, so any change to
      it is a breaking change for consumers and must be made deliberately.
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: season
        data_type: VARCHAR
        data_tests: *unit_not_null
      - name: fpl_id
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: round
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: web_name
        data_type: VARCHAR
        data_tests: *unit_not_null
      - name: deadline_time
        data_type: TIMESTAMP
        data_tests: *unit_not_null
      - name: fixture_count
        data_type: INTEGER
        data_tests: *unit_not_null
      # Legitimately NULL for a blank gameweek — no fixture states them — so
      # they are excluded from the not_null sweep below, which exists to catch
      # a COALESCE being dropped from the additive measures.
      - name: first_kickoff_time
        data_type: TIMESTAMP
      - name: last_kickoff_time
        data_type: TIMESTAMP
      - name: is_ratified
        data_type: BOOLEAN
      - name: minutes
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: starts
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: total_points
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: bonus
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: bps
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: goals_scored
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: assists
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: clean_sheets
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: goals_conceded
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: own_goals
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: penalties_saved
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: penalties_missed
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: yellow_cards
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: red_cards
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: saves
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: clearances_blocks_interceptions
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: recoveries
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: tackles
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: defensive_contribution
        data_type: INTEGER
        data_tests: *unit_not_null
      - name: expected_goals
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: expected_assists
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: expected_goal_involvements
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: expected_goals_conceded
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: influence
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: creativity
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: threat
        data_type: DOUBLE
        data_tests: *unit_not_null
      - name: ict_index
        data_type: DOUBLE
        data_tests: *unit_not_null
      # Event-level, taken from the round's last fixture, so NULL for a blank
      # gameweek for the same reason as the kickoff times above.
      - name: value
        data_type: INTEGER
      - name: selected
        data_type: INTEGER
      - name: transfers_in
        data_type: INTEGER
      - name: transfers_out
        data_type: INTEGER
      - name: transfers_balance
        data_type: INTEGER

