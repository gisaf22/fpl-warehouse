        data_type: VARCHAR
      - name: fpl_id
        data_type: INTEGER
      - name: round
        data_type: INTEGER
      - name: web_name
        data_type: VARCHAR
      - name: deadline_time
        data_type: TIMESTAMP
      - name: fixture_count
        data_type: INTEGER
      - name: first_kickoff_time
        data_type: TIMESTAMP
      - name: last_kickoff_time
        data_type: TIMESTAMP
      - name: is_ratified
        data_type: BOOLEAN
      - name: minutes
