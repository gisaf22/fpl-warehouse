  - name: dim_team
    description: >
      One row per team per season, keyed (season, team_fpl_id), taken from that
      season's latest bootstrap-static capture. A club present in two seasons
      is two rows sharing team_code, never merged. `strength` is staged, not
      carried here (decision 4 on #32). Part of the served contract, published
      to served/dim_team.parquet (#44); the column list below is enforced.
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    # The grain as one expression: dbt's unique test takes a single column, and
    # the key is two. A null in either half nulls the expression, which unique
    # skips — the per-column not_null tests below close that gap.
    data_tests:
      - unique:
          column_name: "season || '|' || team_fpl_id"
          config:
            tags: [unit]
            meta:
              covers: "#40 AC3"
    columns:
      - name: season
        data_type: VARCHAR
        data_tests: &dim_team_key_not_null
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#40 AC3"
      - name: team_fpl_id
        data_type: INTEGER
        description: "{{ doc('season_scoped_key') }}"
        data_tests: *dim_team_key_not_null
      - name: team_code
        data_type: INTEGER
      - name: team_name
        data_type: VARCHAR
        # A null name in the latest capture would be served straight through.
        data_tests: &dim_team_name_not_null
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#44 AC8"
      - name: team_short_name
        data_type: VARCHAR
        data_tests: *dim_team_name_not_null

  - name: dim_player
    description: >
      One row per player per season, keyed (season, fpl_id), for every player
      in int_player_season — departed players included. position is the one
      FPL assigns for the season, taken from the player's latest appearance;
      it is fixed within a season (decision 2 on #32), which the
      constant_per_key test on stg_player.position_id enforces. No team: team
      is per fixture, on fct_player_fixture. Part of the served contract,
      published to served/dim_player.parquet (#44); the column list below is
      enforced.
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    # The grain as one expression, as in dim_team: a null in either half nulls
    # the expression, which unique skips, so the key columns are also not_null.
    data_tests:
      - unique:
          column_name: "season || '|' || fpl_id"
          config:
            tags: [unit]
            meta:
              covers: "#41 AC3"
    columns:
      - name: season
        data_type: VARCHAR
        data_tests: &dim_player_not_null
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#41 AC3"
      - name: fpl_id
        data_type: INTEGER
        description: "{{ doc('season_scoped_key') }}"
        data_tests: *dim_player_not_null
      - name: player_code
        data_type: INTEGER
        description: >
          FPL's cross-season player identifier. Carried only; never joined,
          deduplicated or filtered on.
      - name: web_name
        data_type: VARCHAR
        description: The latest appearance's spelling within the season.
      - name: position_id
        data_type: INTEGER
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#41 AC3"
          # FPL defines four positions. An id outside 1-4 is one the
          # enumeration below does not know.
          - value_between:
              arguments:
                min_value: 1
                max_value: 4
              config:
                tags: [unit]
                meta:
                  covers: "#41 AC6"
      - name: position_short_name
        data_type: VARCHAR
        description: >
          The position's short name (GKP, DEF, MID, FWD), from the same capture
          as position_id. A new value fails the enumeration, so adding a
          position is a deliberate contract change.
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#41 AC3"
          - accepted_values:
              arguments:
                values: [GKP, DEF, MID, FWD]
              config:
                tags: [unit]
                meta:
                  covers: "#41 AC3"

  - name: dim_fixture
    description: >
      One row per fixture per season, keyed (season, fixture_id). Teams, gameweek,
      kickoff and result come from the fixture's latest capture; difficulty
      is pre-kickoff (decision 3 on #32, see its columns). A double gameweek has
      more than 10 fixtures and a team playing twice; a blank gameweek has fewer
      than 10. Nothing here assumes either count. Part of the served contract,
      published to served/dim_fixture.parquet (#44); the column list below is
      enforced.
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    # The grain as one expression, as in dim_team: a null in either half nulls
    # the expression, which unique skips, so the key columns are also not_null.
    data_tests:
      - unique:
          column_name: "season || '|' || fixture_id"
          config:
            tags: [unit]
            meta:
              covers: "#42 AC1"
      # Both sides resolve within the fixture's own season. relationships
      # skips a null from-value, and a team id is never null here: stg_fixture
      # stages both sides from every fixture object.
      - relationships:
          column_name: "season || '|' || team_h_fpl_id"
          arguments:
            to: ref('dim_team')
            field: "season || '|' || team_fpl_id"
          config: &dim_fixture_team_resolves
            tags: [integration]
            meta:
              covers: "#42 AC2"
      - relationships:
          column_name: "season || '|' || team_a_fpl_id"
          arguments:
            to: ref('dim_team')
            field: "season || '|' || team_fpl_id"
          config: *dim_fixture_team_resolves
    columns:
      - name: season
        data_type: VARCHAR
        data_tests: &dim_fixture_key_not_null
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#42 AC1"
      - name: fixture_id
        data_type: INTEGER
        description: "{{ doc('season_scoped_key') }}"
        data_tests: *dim_fixture_key_not_null
      - name: gameweek
        data_type: INTEGER
        description: >
          {{ doc('season_scoped_key') }}
          Nullable, no not_null test: null for a fixture FPL has not scheduled
          (postponed, or not yet given a date). Such a fixture is still one of
          the season's fixtures and is kept.
        data_tests:
          - value_between:
              arguments: {min_value: 1, max_value: 38}
              config: &dim_fixture_in_range
                tags: [unit]
                meta:
                  covers: "#42 AC7"
      - name: kickoff_time
        data_type: TIMESTAMP
        description: >
          Nullable, no not_null test: null for a fixture FPL has not scheduled,
          for the same reason as gameweek.
      - name: team_h_fpl_id
        data_type: INTEGER
        description: "{{ doc('season_scoped_key') }}"
      - name: team_a_fpl_id
        data_type: INTEGER
        description: "{{ doc('season_scoped_key') }}"
      - name: team_h_score
        data_type: INTEGER
        description: >
          Nullable, no not_null test: null until the fixture is played. Taken
          from the latest capture, so it is the final score once there is one.
        data_tests:
          - value_between:
              arguments: {min_value: 0}
              config: *dim_fixture_in_range
      - name: team_a_score
        data_type: INTEGER
        description: Nullable, no not_null test, for the same reason as team_h_score.
        data_tests:
          - value_between:
              arguments: {min_value: 0}
              config: *dim_fixture_in_range
      - name: finished
        data_type: BOOLEAN
      - name: team_h_difficulty
        data_type: INTEGER
        description: "{{ doc('pre_kickoff') }}"
        data_tests: &dim_fixture_difficulty
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#42 AC4"
          - value_between:
              arguments: {min_value: 1, max_value: 5}
              config: *dim_fixture_in_range
      - name: team_a_difficulty
        data_type: INTEGER
        description: "{{ doc('pre_kickoff') }}"
        data_tests: *dim_fixture_difficulty
      # BOOLEAN, so true and false are its only values; not_null is the
      # remaining half of "only its defined values".
      - name: difficulty_is_pre_kickoff
        data_type: BOOLEAN
        description: "{{ doc('pre_kickoff') }}"
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#42 AC5"

  - name: dim_fixture_schedule_history
    description: |
      One row per change in a fixture's schedule, per season: (season,
      fixture_id) plus the interval [valid_from, valid_to) the schedule held
      over, read from admitted fixtures captures (#152, Feature #151). The
      schedule is the gameweek, kickoff, home and away sides and each side's
      difficulty; the result is not part of it. valid_to is null on the open
      row. A schedule opens at the capture that first showed it and is never
      backdated, so before a fixture's first capture there is no row, and
      2025-26 holds one row per fixture, opened at its single end-of-season
      capture. Part of the served contract, published to
      served/dim_fixture_schedule_history.parquet (#154); the column list
      below is enforced.

      **Which fixture table answers what** (#151 C8). dim_fixture holds one
      row per fixture: its latest schedule and result, with the difficulty
      from its last capture before kickoff where there is one
      (difficulty_is_pre_kickoff). This table holds every schedule a fixture
      had, for the schedule as of any moment. Looked up as of kickoff, its
      difficulty equals dim_fixture's wherever difficulty_is_pre_kickoff is
      true. Its open row holds FPL's current difficulty, which FPL may revise
      after kickoff.

      **As of a moment** (#153): the schedule a manager could have known is
      the row opened strictly before the moment. The moment is the
      consumer's own: a deadline, a kickoff or any other time. Join on season
      and fixture_id, then
      `valid_from < moment and (valid_to is null or valid_to >= moment)`,
      as for dim_player_status_history: a row opened exactly at the moment
      does not match, and the row it closes still does. There is no max_age:
      a row holds until the next change, however old its opening capture. A
      fixture with no capture before the moment matches no row, which a left
      join returns as nulls: every 2025-26 deadline, and 2026-27's gameweek 1
      and 2, predate their season's first capture. For example, every
      fixture's schedule at each 2026-27 deadline, where `deadlines` is the
      consumer's own (season, gameweek, deadline_time) list until
      `dim_gameweek` serves one (#133):

      ```sql
      select g.gameweek as deadline_gameweek, f.fixture_id,
             h.gameweek, h.kickoff_time, h.team_h_fpl_id, h.team_a_fpl_id,
             h.team_h_difficulty, h.team_a_difficulty
      from dim_fixture as f
      join deadlines as g on g.season = f.season
      left join dim_fixture_schedule_history as h
          on  h.season = f.season
          and h.fixture_id = f.fixture_id
          and h.valid_from < g.deadline_time
          and (h.valid_to is null or h.valid_to >= g.deadline_time)
      where f.season = '2026-27'
      ```

      In dbt the `as_of` macro does the same, on valid_from with keys
      season and fixture_id, and no max_age.
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: season
        data_type: VARCHAR
        description: "{{ doc('season_scoped_key') }}"
      - name: fixture_id
        data_type: INTEGER
        description: FPL's fixture id within the season.
      - name: valid_from
        data_type: TIMESTAMP
        description: >
          observed_at of the capture that first showed this schedule.
      - name: valid_to
        data_type: TIMESTAMP
        description: >
          valid_from of the fixture's next row; null on the open row.
      - name: gameweek
        data_type: INTEGER
        description: >
          The gameweek the fixture was in. Null while FPL had it unscheduled
          or postponed.
      - name: kickoff_time
        data_type: TIMESTAMP
        description: >
          The kickoff FPL published (UTC). Null while unscheduled or
          postponed. A reschedule opens a new row.
      - name: team_h_fpl_id
        data_type: INTEGER
        description: The home side's team id within the season.
      - name: team_a_fpl_id
        data_type: INTEGER
        description: The away side's team id within the season.
      - name: team_h_difficulty
        data_type: INTEGER
        description: FPL's difficulty rating for the home side.
      - name: team_a_difficulty
        data_type: INTEGER
        description: FPL's difficulty rating for the away side.
      - name: capture_key
        data_type: VARCHAR
        description: >
          The capture that opened the row: the evidence for valid_from
          (ADR 0001). Later captures never change it.

  - name: dim_player_status_history
    description: |
      One row per change in a player's tracked status fields, per season:
      (season, fpl_id) plus the interval [valid_from, valid_to) the state held
      over, read from admitted bootstrap-static captures (#126). valid_to is
      null on the open row. A state opens at the capture that first showed it
      and is never backdated, so before a player's first capture there is no
      row. Part of the served contract, published to
      served/dim_player_status_history.parquet (#127); the column list below
      is enforced.

      **As of a deadline** (#128): the state a manager could have known is
      the row holding the player's last capture strictly before the deadline.
      Join on season and fpl_id, then
      `valid_from < deadline and (valid_to is null or valid_to >= deadline)`.
      This is deliberately not the usual half-open
      `valid_from <= deadline < valid_to`: a capture exactly at the deadline
      is not "before" it, so a row that capture opens must not match, and the
      row it closes still does. Row boundaries are capture times, so the
      condition picks exactly the row containing the last capture before the
      deadline. A player with no capture before the deadline matches no row
      (no backdating), which a left join returns as nulls. For example, every
      player's status at each 2026-27 deadline, where `deadlines` is the
      consumer's own (season, gameweek, deadline_time) list until
      `dim_gameweek` serves one (#133):

      ```sql
      select g.gameweek, p.fpl_id, h.status
      from dim_player as p
      join deadlines as g on g.season = p.season
      left join dim_player_status_history as h
          on  h.season = p.season
          and h.fpl_id = p.fpl_id
          and h.valid_from < g.deadline_time
          and (h.valid_to is null or h.valid_to >= g.deadline_time)
      where p.season = '2026-27'
      ```

      In dbt the `player_status_as_of` macro does the same. How old that
      state was at the deadline is a property of the deadline, not the
      player, since every capture covers every player; it belongs to
      `dim_gameweek` (#133).
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: season
        data_type: VARCHAR
      - name: fpl_id
        data_type: INTEGER
        description: "{{ doc('season_scoped_key') }}"
      - name: valid_from
        data_type: TIMESTAMP
        description: >
          observed_at of the capture that opened the row, in UTC. The state is
          known from this moment.
      - name: valid_to
        data_type: TIMESTAMP
        description: >
          observed_at of the capture that opened the next row; null on the
          open row.
      - name: status
        data_type: VARCHAR
        description: >
          FPL's availability code. Only the values observed in captures are
          accepted; a new one fails the build until it is classified (#123).
        data_tests:
          # The allowed set is exactly the values observed in both seasons'
          # captures as of #125 (2026-10-09). A value outside it failing the
          # build is deliberate: classify it, then add it here.
          - accepted_values:
              arguments:
                values: ["a", "u", "i", "d", "s"]
              config:
                tags: [integration]
                meta:
                  covers: "#126 AC6"
      - name: chance_of_playing_this_round
        data_type: INTEGER
      - name: chance_of_playing_next_round
        data_type: INTEGER
      - name: news
        data_type: VARCHAR
        description: FPL's news text; null where FPL publishes an empty string.
      - name: can_select
        data_type: BOOLEAN
      - name: removed
        data_type: BOOLEAN
      - name: team_fpl_id
        data_type: INTEGER
        description: |
          The club listed at the capture, valid only within this row's
          interval. The club a player played for in a fixture is
          fct_player_fixture.team_fpl_id.

          {{ doc('season_scoped_key') }}
      - name: position_id
        data_type: INTEGER
      - name: news_added
        data_type: TIMESTAMP
        description: >
          When FPL says the news was added, from the opening capture. An
          attribute: it never opens a row.
      - name: player_code
        data_type: INTEGER
        description: >
          FPL's cross-season player identifier, from the opening capture.
          Carried only; never joined, deduplicated or filtered on.
      - name: capture_key
        data_type: VARCHAR
        description: >
          Key of the raw capture that opened the row, the evidence for
          valid_from (ADR 0001). An audit reference: consumers cannot read the
          raw tree.

  - name: fct_player_market_snapshot
    description: |
      Each player's market state at every admitted bootstrap-static capture:
      price, ownership and the gameweek's transfer flow as FPL published them
      (#141, Feature #138). One row per (season, fpl_id, capture_key). A fact,
      not SCD2: every capture is a row. Part of the served contract, published
      to served/fct_player_market_snapshot.parquet (#143); the column list
      below is enforced.

      **Per capture, not per gameweek** (#138 M4). These are bootstrap-static's
      values at the capture's observed_at. fct_player_gameweek's value,
      selected and transfers_* are per gameweek, from element-summary history
      rows, and are a different measurement; slice 2 (#133) removes them.

      The capture's total player count is not served: it is one value per
      capture, not per player (#143 P3).

      **As of a moment** (#142): the player's last capture strictly before it.
      The moment is the consumer's own, not wired to the gameweek deadline.
      Strictly before means a capture exactly at the moment is excluded. From
      the parquet, for example the market at each 2026-27 deadline, where
      `deadlines` is the consumer's own (season, gameweek, deadline_time) list
      until `dim_gameweek` serves one (#133):

      ```sql
      select g.gameweek, m.fpl_id, m.observed_at, m.now_cost,
             m.selected_by_percent
      from deadlines as g
      join fct_player_market_snapshot as m
          on  m.season = g.season
          and m.observed_at < g.deadline_time
      where g.season = '2026-27'
      qualify row_number() over (
          partition by g.gameweek, m.fpl_id order by m.observed_at desc
      ) = 1
      ```

      A player with no capture before the moment has no row. In dbt, the
      `as_of` macro does the same, with an optional max_age that returns
      null for a latest capture older than [moment - max_age, moment)
      (#142 P3–P5).
    group: warehouse_internal
    access: public
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, fpl_id, capture_key]
          config:
            tags: [unit]
            meta:
              covers: "#141 AC1"
      # The as-of lookup takes the last capture before a deadline by
      # observed_at; two captures of a player at the same moment would leave
      # it undefined, so a tie fails the build rather than resolving silently.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, fpl_id, observed_at]
          config:
            tags: [unit]
            meta:
              covers: "#142 AC5"
    columns:
      - name: season
        data_type: VARCHAR
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC1"
      - name: fpl_id
        data_type: INTEGER
        description: "{{ doc('season_scoped_key') }}"
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC1"
      - name: capture_key
        data_type: VARCHAR
        description: >
          The capture's key in the capture index: an audit reference to the
          capture this row was read from. Consumers cannot read raw/.
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC1"
      - name: observed_at
        data_type: TIMESTAMP
        description: When the capture was received (fpl-ingest's received_at), in UTC.
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC3"
      # Ranges (AC2). value_between passes nulls by design (#53), so each field
      # also carries not_null: never null in any capture to 2026-10-09, so a
      # null is a source change and fails the build (#141 E3).
      - name: now_cost
        data_type: INTEGER
        data_tests:
          - value_between:
              arguments: {min_value: 1}
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC2"
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC2"
      - name: selected_by_percent
        data_type: DECIMAL(4,1)
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 100}
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC2"
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC2"
      - name: transfers_in_event
        data_type: INTEGER
        data_tests:
          - value_between:
              arguments: {min_value: 0}
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC2"
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC2"
      - name: transfers_out_event
        data_type: INTEGER
        data_tests:
          - value_between:
              arguments: {min_value: 0}
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC2"
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#141 AC2"

  - name: dim_gameweek
    description: >
      One row per (season, gameweek): the gameweek's deadline, and how old the
      newest staged bootstrap-static capture before it was (pre-deadline
      freshness, GLOSSARY.md). Every season with an admitted bootstrap-static
      capture has gameweeks 1..38 (#169, Feature #163). Private until it is
      served (#170).
    group: warehouse_internal
    access: private
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, gameweek]
          config:
            tags: [unit]
            meta:
              covers: "#169 AC1"
    columns:
      - name: season
        description: "{{ doc('season_scoped_key') }}"
      - name: gameweek
        description: FPL's gameweek (event) number within the season.
      - name: deadline_time
        description: >
          The transfer deadline (UTC) as the season's newest staged capture
          states it, by observed_at with run_id breaking a repeat.
      - name: last_capture_before_deadline_at
        description: >
          observed_at of the newest staged bootstrap-static capture of the
          season strictly before deadline_time. Null when the deadline has not
          passed by the capture clock, or when no staged capture precedes it.
      - name: state_age_seconds
        description: >
          deadline_time minus last_capture_before_deadline_at, in whole
          seconds. Null when last_capture_before_deadline_at is.
