        data_type: INTEGER
      - name: transfers_in
        data_type: INTEGER
      - name: transfers_out
        data_type: INTEGER
      - name: transfers_balance
        data_type: INTEGER
      - name: modified
        data_type: BOOLEAN
      - name: is_ratified
        data_type: BOOLEAN
        description: "{{ doc('ratified') }}"
      - name: team_fpl_id
        data_type: INTEGER
        description: >
          {{ doc('season_scoped_key') }}
          The club the player played for in this fixture, as of the fixture:
          the fixture's home side if was_home, else its away side. Resolved per
          fixture, so a mid-season transfer — even between the two fixtures of
          a double gameweek — carries each fixture's own club. Added 2026-09-27
          (#43) as the last column, an additive change: every existing column
          keeps its name, type and position. Not on fct_player_gameweek.
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#43 AC3"

