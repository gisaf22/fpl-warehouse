        data_type: INTEGER
      - name: total_points
        data_type: INTEGER
      - name: bonus
        data_type: INTEGER
      - name: bps
        data_type: INTEGER
      - name: goals_scored
        data_type: INTEGER
      - name: assists
        data_type: INTEGER
      - name: clean_sheets
        data_type: INTEGER
      - name: goals_conceded
        data_type: INTEGER
      - name: own_goals
        data_type: INTEGER
      - name: penalties_saved
        data_type: INTEGER
      - name: penalties_missed
        data_type: INTEGER
      - name: yellow_cards
        data_type: INTEGER
      - name: red_cards
        data_type: INTEGER
      - name: saves
        data_type: INTEGER
      - name: clearances_blocks_interceptions
        data_type: INTEGER
      - name: recoveries
        data_type: INTEGER
      - name: tackles
        data_type: INTEGER
      - name: defensive_contribution
        data_type: INTEGER
      - name: expected_goals
        data_type: DOUBLE
      - name: expected_assists
        data_type: DOUBLE
      - name: expected_goal_involvements
        data_type: DOUBLE
      - name: expected_goals_conceded
        data_type: DOUBLE
      - name: influence
