version: 2

# dbt unit tests for the marts layer. Each carries exactly one tier tag, like
# every other test, and a `covers` meta entry naming the board item and
# acceptance criterion it pins.

unit_tests:

  # --- dim_team: one row per team per season (#40) ----------------------------

  - name: team_dimension_takes_each_seasons_latest_capture
    description: >
      Each season's teams come from that season's latest capture only. A team
      renamed between captures reads its latest name, and a team listed only in
      an earlier capture is not carried. The closed season's single, older
      capture still stands for its own season: latest is per season, never
      across them.
    model: dim_team
    config:
      tags: [unit]
      meta:
        covers: "#40 AC1"
    given:
      - input: ref('stg_team')
        rows:
          - {season: "2025-26", run_id: "20260526T034626Z-aaaa", extracted_at: "2026-05-26 03:46:26", observed_at: "2026-05-26 03:46:26", team_fpl_id: 1, team_code: 3, team_name: "Arsenal", team_short_name: "ARS"}
          - {season: "2026-27", run_id: "20260829T191108Z-bbbb", extracted_at: "2026-08-29 19:11:08", observed_at: "2026-08-29 19:11:08", team_fpl_id: 1, team_code: 3, team_name: "Old name", team_short_name: "OLD"}
          - {season: "2026-27", run_id: "20260829T191108Z-bbbb", extracted_at: "2026-08-29 19:11:08", observed_at: "2026-08-29 19:11:08", team_fpl_id: 99, team_code: 999, team_name: "Earlier only", team_short_name: "EAR"}
          - {season: "2026-27", run_id: "20260914T211204Z-cccc", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", team_fpl_id: 1, team_code: 3, team_name: "Arsenal", team_short_name: "ARS"}
          - {season: "2026-27", run_id: "20260914T211204Z-cccc", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", team_fpl_id: 2, team_code: 7, team_name: "Aston Villa", team_short_name: "AVL"}
    expect:
      rows:
        - {season: "2025-26", team_fpl_id: 1, team_code: 3, team_name: "Arsenal", team_short_name: "ARS"}
        - {season: "2026-27", team_fpl_id: 1, team_code: 3, team_name: "Arsenal", team_short_name: "ARS"}
        - {season: "2026-27", team_fpl_id: 2, team_code: 7, team_name: "Aston Villa", team_short_name: "AVL"}

  - name: latest_capture_is_ordered_by_observed_at_with_run_id_breaking_a_tie
    description: >
      "Latest wins" orders by observed_at (the index's received_at), then
      run_id. In 2026-27 the two captures share a run start, and the one with
      the lower run_id was observed later, so it wins: ordering by run start
      and then run_id would pick the other. In 2025-26 the two captures were
      observed at the same instant, so the higher run_id wins.
    model: dim_team
    config:
      tags: [unit]
      meta:
        covers: "#104 AC3"
    given:
      - input: ref('stg_team')
        rows:
          - {season: "2026-27", run_id: "20260914T211204Z-zzzz", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:10", team_fpl_id: 1, team_code: 3, team_name: "Observed first", team_short_name: "OBF"}
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:20", team_fpl_id: 1, team_code: 3, team_name: "Observed last", team_short_name: "OBL"}
          - {season: "2025-26", run_id: "20260526T034626Z-aaaa", extracted_at: "2026-05-26 03:46:26", observed_at: "2026-05-26 03:46:26", team_fpl_id: 1, team_code: 3, team_name: "Lower run_id", team_short_name: "LOW"}
          - {season: "2025-26", run_id: "20260526T034626Z-bbbb", extracted_at: "2026-05-26 03:46:26", observed_at: "2026-05-26 03:46:26", team_fpl_id: 1, team_code: 3, team_name: "Higher run_id", team_short_name: "HIG"}
    expect:
      rows:
        - {season: "2025-26", team_fpl_id: 1, team_name: "Higher run_id"}
        - {season: "2026-27", team_fpl_id: 1, team_name: "Observed last"}

  - name: same_club_in_two_seasons_is_two_rows_sharing_its_team_code
    description: >
      Season partitions; it never relates. A club present in both seasons is
      two rows with the same team_code — whether its team_fpl_id is the same
      in both seasons or was reassigned — never merged into one.
    model: dim_team
    config:
      tags: [unit]
      meta:
        covers: "#40 AC2"
    given:
      - input: ref('stg_team')
        rows:
          - {season: "2025-26", run_id: "20260526T034626Z-aaaa", extracted_at: "2026-05-26 03:46:26", observed_at: "2026-05-26 03:46:26", team_fpl_id: 1, team_code: 3, team_name: "Arsenal", team_short_name: "ARS"}
          - {season: "2025-26", run_id: "20260526T034626Z-aaaa", extracted_at: "2026-05-26 03:46:26", observed_at: "2026-05-26 03:46:26", team_fpl_id: 13, team_code: 43, team_name: "Man City", team_short_name: "MCI"}
          - {season: "2026-27", run_id: "20260914T211204Z-cccc", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", team_fpl_id: 1, team_code: 3, team_name: "Arsenal", team_short_name: "ARS"}
          - {season: "2026-27", run_id: "20260914T211204Z-cccc", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", team_fpl_id: 12, team_code: 43, team_name: "Man City", team_short_name: "MCI"}
    expect:
      rows:
        - {season: "2025-26", team_fpl_id: 1, team_code: 3}
        - {season: "2025-26", team_fpl_id: 13, team_code: 43}
        - {season: "2026-27", team_fpl_id: 1, team_code: 3}
        - {season: "2026-27", team_fpl_id: 12, team_code: 43}

  # --- dim_fixture: one row per fixture per season (#42) -----------------------
  #
  # The fixture tree's difficulty never changes between captures, so which
  # capture a value came from is only distinguishable with mocked input.

  - name: fixture_difficulty_is_the_last_value_before_kickoff
    description: >
      A fixture captured twice before kickoff, with difficulty 2 and then 3,
      and once after kickoff with 5, serves 3, the value managers saw last
      before the match, and is flagged pre-kickoff. Kickoff is the latest
      capture's: the fixture was moved forward from 16:30 to 14:00, so the
      13:00 capture is before kickoff and the 15:00 one is not.
    model: dim_fixture
    config:
      tags: [unit]
      meta:
        covers: "#42 AC3"
    given:
      - input: ref('stg_fixture')
        rows:
          - {season: "2026-27", run_id: "20260910T190000Z-aaaa", extracted_at: "2026-09-10 19:00:00", observed_at: "2026-09-10 19:00:00", fixture_id: 30, gameweek: 3, kickoff_time: "2026-09-13 16:30:00", team_h_fpl_id: 1, team_a_fpl_id: 2, team_h_score: null, team_a_score: null, finished: false, team_h_difficulty: 2, team_a_difficulty: 4}
          - {season: "2026-27", run_id: "20260913T130000Z-bbbb", extracted_at: "2026-09-13 13:00:00", observed_at: "2026-09-13 13:00:00", fixture_id: 30, gameweek: 3, kickoff_time: "2026-09-13 16:30:00", team_h_fpl_id: 1, team_a_fpl_id: 2, team_h_score: null, team_a_score: null, finished: false, team_h_difficulty: 3, team_a_difficulty: 4}
          - {season: "2026-27", run_id: "20260913T150000Z-cccc", extracted_at: "2026-09-13 15:00:00", observed_at: "2026-09-13 15:00:00", fixture_id: 30, gameweek: 3, kickoff_time: "2026-09-13 14:00:00", team_h_fpl_id: 1, team_a_fpl_id: 2, team_h_score: null, team_a_score: null, finished: false, team_h_difficulty: 5, team_a_difficulty: 1}
    expect:
      rows:
        - {season: "2026-27", fixture_id: 30, kickoff_time: "2026-09-13 14:00:00", team_h_difficulty: 3, team_a_difficulty: 4, difficulty_is_pre_kickoff: true}

  - name: fixture_with_no_capture_before_kickoff_keeps_its_difficulty_flagged_false
    description: >
      A fixture with no capture before kickoff keeps a difficulty rather than
      going null, and is flagged not pre-kickoff. For a live fixture that
      kicked off before capture history began, the value is its earliest
      capture's, the one closest to kickoff. A closed season's single
      end-of-season snapshot is flagged the same way.
    model: dim_fixture
    config:
      tags: [unit]
      meta:
        covers: "#42 AC4"
    given:
      - input: ref('stg_fixture')
        rows:
          - {season: "2025-26", run_id: "20260526T034626Z-aaaa", extracted_at: "2026-05-26 03:46:26", observed_at: "2026-05-26 03:46:26", fixture_id: 1, gameweek: 1, kickoff_time: "2025-08-15 19:00:00", team_h_fpl_id: 12, team_a_fpl_id: 4, team_h_score: 4, team_a_score: 2, finished: true, team_h_difficulty: 3, team_a_difficulty: 5}
          - {season: "2026-27", run_id: "20260829T191108Z-bbbb", extracted_at: "2026-08-29 19:11:08", observed_at: "2026-08-29 19:11:08", fixture_id: 1, gameweek: 1, kickoff_time: "2026-08-21 19:00:00", team_h_fpl_id: 1, team_a_fpl_id: 2, team_h_score: 2, team_a_score: 0, finished: true, team_h_difficulty: 2, team_a_difficulty: 4}
          - {season: "2026-27", run_id: "20260914T211204Z-cccc", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 1, gameweek: 1, kickoff_time: "2026-08-21 19:00:00", team_h_fpl_id: 1, team_a_fpl_id: 2, team_h_score: 2, team_a_score: 0, finished: true, team_h_difficulty: 3, team_a_difficulty: 5}
    expect:
      rows:
        - {season: "2025-26", fixture_id: 1, team_h_difficulty: 3, team_a_difficulty: 5, difficulty_is_pre_kickoff: false}
        - {season: "2026-27", fixture_id: 1, team_h_difficulty: 2, team_a_difficulty: 4, difficulty_is_pre_kickoff: false}

  - name: finished_fixture_reports_its_latest_captured_score
    description: >
      A fixture's result comes from its latest capture: no score before the
      match, a provisional 1-0 while it was in progress, then 2-1 final. The
      dimension serves 2-1 and finished, never an older score.
    model: dim_fixture
    config:
      tags: [unit]
      meta:
        covers: "#42 AC5"
    given:
      - input: ref('stg_fixture')
        rows:
          - {season: "2026-27", run_id: "20260906T120000Z-aaaa", extracted_at: "2026-09-06 12:00:00", observed_at: "2026-09-06 12:00:00", fixture_id: 40, gameweek: 4, kickoff_time: "2026-09-06 14:00:00", team_h_fpl_id: 5, team_a_fpl_id: 6, team_h_score: null, team_a_score: null, finished: false, team_h_difficulty: 3, team_a_difficulty: 3}
          - {season: "2026-27", run_id: "20260906T150000Z-bbbb", extracted_at: "2026-09-06 15:00:00", observed_at: "2026-09-06 15:00:00", fixture_id: 40, gameweek: 4, kickoff_time: "2026-09-06 14:00:00", team_h_fpl_id: 5, team_a_fpl_id: 6, team_h_score: 1, team_a_score: 0, finished: false, team_h_difficulty: 3, team_a_difficulty: 3}
          - {season: "2026-27", run_id: "20260906T191056Z-cccc", extracted_at: "2026-09-06 19:10:56", observed_at: "2026-09-06 19:10:56", fixture_id: 40, gameweek: 4, kickoff_time: "2026-09-06 14:00:00", team_h_fpl_id: 5, team_a_fpl_id: 6, team_h_score: 2, team_a_score: 1, finished: true, team_h_difficulty: 3, team_a_difficulty: 3}
    expect:
      rows:
        - {season: "2026-27", fixture_id: 40, team_h_score: 2, team_a_score: 1, finished: true}

  - name: double_and_blank_gameweeks_keep_every_fixture
    description: >
      Round 2 is a double: 11 fixtures, with team 1 playing twice. Round 3 is
      a blank with one fixture. Every fixture in both is one row with its own
      teams and gameweek. Nothing is dropped to reach 10 per gameweek or one per
      team per gameweek.
    model: dim_fixture
    config:
      tags: [unit]
      meta:
        covers: "#42 AC8"
    given:
      - input: ref('stg_fixture')
        rows:
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 11, gameweek: 2, kickoff_time: "2026-08-29 14:00:00", team_h_fpl_id: 1,  team_a_fpl_id: 2,  team_h_difficulty: 3, team_a_difficulty: 3}
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 12, gameweek: 2, kickoff_time: "2026-08-29 14:00:00", team_h_fpl_id: 3,  team_a_fpl_id: 4,  team_h_difficulty: 3, team_a_difficulty: 3}
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 13, gameweek: 2, kickoff_time: "2026-08-29 14:00:00", team_h_fpl_id: 5,  team_a_fpl_id: 6,  team_h_difficulty: 3, team_a_difficulty: 3}
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 14, gameweek: 2, kickoff_time: "2026-08-29 14:00:00", team_h_fpl_id: 7,  team_a_fpl_id: 8,  team_h_difficulty: 3, team_a_difficulty: 3}
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 15, gameweek: 2, kickoff_time: "2026-08-29 14:00:00", team_h_fpl_id: 9,  team_a_fpl_id: 10, team_h_difficulty: 3, team_a_difficulty: 3}
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 16, gameweek: 2, kickoff_time: "2026-08-29 14:00:00", team_h_fpl_id: 11, team_a_fpl_id: 12, team_h_difficulty: 3, team_a_difficulty: 3}
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 17, gameweek: 2, kickoff_time: "2026-08-29 14:00:00", team_h_fpl_id: 13, team_a_fpl_id: 14, team_h_difficulty: 3, team_a_difficulty: 3}
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 18, gameweek: 2, kickoff_time: "2026-08-29 14:00:00", team_h_fpl_id: 15, team_a_fpl_id: 16, team_h_difficulty: 3, team_a_difficulty: 3}
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 19, gameweek: 2, kickoff_time: "2026-08-29 14:00:00", team_h_fpl_id: 17, team_a_fpl_id: 18, team_h_difficulty: 3, team_a_difficulty: 3}
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 20, gameweek: 2, kickoff_time: "2026-08-29 14:00:00", team_h_fpl_id: 19, team_a_fpl_id: 20, team_h_difficulty: 3, team_a_difficulty: 3}
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 21, gameweek: 2, kickoff_time: "2026-09-01 19:00:00", team_h_fpl_id: 3,  team_a_fpl_id: 1,  team_h_difficulty: 3, team_a_difficulty: 3}
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 22, gameweek: 3, kickoff_time: "2026-09-13 14:00:00", team_h_fpl_id: 2,  team_a_fpl_id: 5,  team_h_difficulty: 3, team_a_difficulty: 3}
    expect:
      rows:
        - {fixture_id: 11, gameweek: 2, team_h_fpl_id: 1,  team_a_fpl_id: 2}
        - {fixture_id: 12, gameweek: 2, team_h_fpl_id: 3,  team_a_fpl_id: 4}
        - {fixture_id: 13, gameweek: 2, team_h_fpl_id: 5,  team_a_fpl_id: 6}
        - {fixture_id: 14, gameweek: 2, team_h_fpl_id: 7,  team_a_fpl_id: 8}
        - {fixture_id: 15, gameweek: 2, team_h_fpl_id: 9,  team_a_fpl_id: 10}
        - {fixture_id: 16, gameweek: 2, team_h_fpl_id: 11, team_a_fpl_id: 12}
        - {fixture_id: 17, gameweek: 2, team_h_fpl_id: 13, team_a_fpl_id: 14}
        - {fixture_id: 18, gameweek: 2, team_h_fpl_id: 15, team_a_fpl_id: 16}
        - {fixture_id: 19, gameweek: 2, team_h_fpl_id: 17, team_a_fpl_id: 18}
        - {fixture_id: 20, gameweek: 2, team_h_fpl_id: 19, team_a_fpl_id: 20}
        - {fixture_id: 21, gameweek: 2, team_h_fpl_id: 3,  team_a_fpl_id: 1}
        - {fixture_id: 22, gameweek: 3, team_h_fpl_id: 2,  team_a_fpl_id: 5}

  - name: postponed_fixture_is_kept_with_null_gameweek_and_kickoff
    description: >
      A fixture scheduled in gameweek 5 and then postponed has no gameweek and no
      kickoff in its latest capture. It is kept, with both null. It is not
      dropped, and the earlier capture's gameweek and kickoff are not carried
      forward. It has not been played, so every capture is before kickoff and
      its difficulty is flagged pre-kickoff.
    model: dim_fixture
    config:
      tags: [unit]
      meta:
        covers: "#42 AC9"
    given:
      - input: ref('stg_fixture')
        rows:
          - {season: "2026-27", run_id: "20260906T191056Z-aaaa", extracted_at: "2026-09-06 19:10:56", observed_at: "2026-09-06 19:10:56", fixture_id: 41, gameweek: 5, kickoff_time: "2026-09-27 14:00:00", team_h_fpl_id: 3, team_a_fpl_id: 14, team_h_score: null, team_a_score: null, finished: false, team_h_difficulty: 3, team_a_difficulty: 4}
          - {season: "2026-27", run_id: "20260914T211204Z-bbbb", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fixture_id: 41, gameweek: null, kickoff_time: null, team_h_fpl_id: 3, team_a_fpl_id: 14, team_h_score: null, team_a_score: null, finished: false, team_h_difficulty: 3, team_a_difficulty: 4}
    expect:
      rows:
        - {season: "2026-27", fixture_id: 41, gameweek: null, kickoff_time: null, team_h_fpl_id: 3, team_a_fpl_id: 14, difficulty_is_pre_kickoff: true}

  # --- fct_player_fixture: team per fixture (#43) ------------------------------

  - name: transfer_between_the_fixtures_of_a_double_gives_each_row_its_own_club
    description: >
      Player 500 plays twice in gameweek 2 and changes clubs in between: at home
      for club 1 against club 2 in fixture 21, then away for club 4 at club 3
      in fixture 22. Each row carries the club of its own fixture, so the two
      rows differ. Resolving the team once per gameweek would give one of them
      the wrong club.
    model: fct_player_fixture
    config:
      tags: [unit]
      meta:
        covers: "#43 AC6"
    given:
      - input: ref('stg_player_fixture')
        rows:
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fpl_id: 500, fixture_id: 21, gameweek: 2, was_home: true,  opponent_team_fpl_id: 2, kickoff_time: "2026-08-29 14:00:00", team_h_score: 1, team_a_score: 0}
          - {season: "2026-27", run_id: "20260914T211204Z-aaaa", extracted_at: "2026-09-14 21:12:04", observed_at: "2026-09-14 21:12:04", fpl_id: 500, fixture_id: 22, gameweek: 2, was_home: false, opponent_team_fpl_id: 3, kickoff_time: "2026-09-01 19:00:00", team_h_score: 2, team_a_score: 2}
      - input: ref('int_gameweek_status')
        rows: []
      - input: ref('dim_fixture')
        rows:
          - {season: "2026-27", fixture_id: 21, gameweek: 2, team_h_fpl_id: 1, team_a_fpl_id: 2}
          - {season: "2026-27", fixture_id: 22, gameweek: 2, team_h_fpl_id: 3, team_a_fpl_id: 4}
    expect:
      rows:
        - {season: "2026-27", fpl_id: 500, fixture_id: 21, team_fpl_id: 1}
        - {season: "2026-27", fpl_id: 500, fixture_id: 22, team_fpl_id: 4}

  # --- dim_player_status_history: one row per change in status (#126) ---------
  # Mocks list only the columns the model reads; the rest default to null.

  - name: identical_captures_collapse_into_one_open_row
    description: >
      Three consecutive captures with the same tracked fields are one state,
      so one row, open from the first capture. The tracked fields include
      nulls (no chance of playing, no news): a null compares equal to a null,
      so it does not open a row every capture.
    model: dim_player_status_history
    config:
      tags: [unit]
      meta:
        covers: "#126 AC1"
    given:
      - input: ref('stg_player')
        rows:
          - {season: "2026-27", fpl_id: 1, run_id: "r1", capture_key: "k1", observed_at: "2026-09-01 19:00:00", player_code: 100, status: "a", chance_of_playing_this_round: null, chance_of_playing_next_round: null, news: null, news_added: null, can_select: true, removed: false, team_fpl_id: 3, position_id: 2}
