  - name: status_change_and_return_reopens_rows_in_capture_order
    description: >
      a -> d -> a is three rows, each closed by the next one's valid_from.
      Captures are ordered by observed_at, then run_id: the two captures
      observed at the same instant are taken in run_id order, so the row
      opened by "r2b" (status a) follows "r2a" (status d). The mock lists them
      out of order so that input order cannot decide.
    model: dim_player_status_history
    config:
      tags: [unit]
      meta:
        covers: "#126 AC2"
    given:
      - input: ref('stg_player')
        rows:
          - {season: "2026-27", fpl_id: 1, run_id: "r2b", capture_key: "k2b", observed_at: "2026-09-02 07:00:00", status: "a", can_select: true, removed: false, team_fpl_id: 3, position_id: 2}
          - {season: "2026-27", fpl_id: 1, run_id: "r1",  capture_key: "k1",  observed_at: "2026-09-01 19:00:00", status: "a", can_select: true, removed: false, team_fpl_id: 3, position_id: 2}
          - {season: "2026-27", fpl_id: 1, run_id: "r2a", capture_key: "k2a", observed_at: "2026-09-02 07:00:00", status: "d", can_select: true, removed: false, team_fpl_id: 3, position_id: 2}
    expect:
      rows:
        - {season: "2026-27", fpl_id: 1, status: "a", valid_from: "2026-09-01 19:00:00", valid_to: "2026-09-02 07:00:00"}
        - {season: "2026-27", fpl_id: 1, status: "d", valid_from: "2026-09-02 07:00:00", valid_to: "2026-09-02 07:00:00"}
        - {season: "2026-27", fpl_id: 1, status: "a", valid_from: "2026-09-02 07:00:00", valid_to: null}

