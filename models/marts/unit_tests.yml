  # --- dim_gameweek: one row per gameweek per season (#169) -------------------

  - name: capture_exactly_at_the_deadline_is_not_before_it
    description: >
      A capture observed exactly at a deadline is not that gameweek's last
      capture before its deadline: strictly before, as every as-of lookup
      (#163 S3, ADR 0002). The capture an hour earlier is, an hour old. A
      later capture moves the capture clock past the deadline, so the
      gameweek has passed.
    model: dim_gameweek
    config:
      tags: [unit]
      meta:
        covers: "#169 AC6"
    given:
      - input: ref('stg_gameweek')
        rows:
          - {season: "2026-27", gameweek: 6, deadline_time: "2026-10-10 10:00:00", capture_key: "k1", run_id: "r1", observed_at: "2026-10-10 09:00:00"}
          - {season: "2026-27", gameweek: 6, deadline_time: "2026-10-10 10:00:00", capture_key: "k2", run_id: "r2", observed_at: "2026-10-10 10:00:00"}
          - {season: "2026-27", gameweek: 6, deadline_time: "2026-10-10 10:00:00", capture_key: "k3", run_id: "r3", observed_at: "2026-10-10 11:00:00"}
      - input: ref('int_gameweek_status')
        rows: []
    expect:
      rows:
        - {season: "2026-27", gameweek: 6, deadline_time: "2026-10-10 10:00:00", last_capture_before_deadline_at: "2026-10-10 09:00:00", state_age_seconds: 3600}

