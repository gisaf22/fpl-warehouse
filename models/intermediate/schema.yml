version: 2

models:
  - name: int_player_season
    description: >
      One row per (season, fpl_id) for every player seen in any bootstrap-static
      capture of that season, departed players included. Identity and the
      newest web_name only: other player attributes belong in dim_player
      (#41). The single source of each season's player set (#69). Internal:
      not part of the served contract.
    group: warehouse_internal
    access: private
    columns:
      - name: season
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#69 AC3"
      - name: fpl_id
        data_tests:
          - not_null:
              config:
                tags: [unit]
                meta:
                  covers: "#69 AC3"
      - name: player_code
        description: >
          FPL's cross-season player identifier, as captured. Carried only; never
          joined, deduplicated or filtered on. Fixed within a season: see the
          constant_per_key test on stg_player.player_code.
      - name: web_name
        description: The newest capture's spelling within the season.

  - name: int_player_gameweek_spine
    description: >
      Complete player x gameweek grid per season: the season roster
      (int_player_season) crossed with the gameweeks the latest capture reports
      as finished. Exists so fct_player_gameweek has a row for every gameweek a
      player should have, including blanks. Internal: not part of the served
      contract.
    group: warehouse_internal
    access: private

  - name: int_gameweek_status
    description: >
      One row per (season, gameweek) carrying FPL's authoritative points-finality flag,
      rolled up from stg_gameweek_status across match dates and across every
      capture ever taken. The source of truth for is_ratified in both served
      models. Internal: not part of the served contract.
    group: warehouse_internal
    access: private

  - name: int_admitted_capture
    description: >
      One row per admitted capture: its season and run_id from the capture
      index, observed_at (the index's received_at), and the served
      extraction_date and extracted_at from the run manifest, or for the
      history port from received_at (#104, #88 E1). Every payload staging
      model joins it, so staging holds admitted captures only. Internal.
    group: warehouse_internal
    access: private

  - name: int_unstaged_admitted_capture
    description: >
      One row per admitted capture of an endpoint with a staging source that
      has no row in any of that endpoint's staging models (#167). severity is
      error, or warn for an endpoint whose source is marked warn-only.
      Internal.
    group: warehouse_internal
    access: private

  - name: int_player_fixture_history_mismatch
    description: >
      One row per element-summary capture whose stg_player_fixture row count
      differs from its payload's history[] entry count (#175 G7): a full or
      partial drop in staging. An empty history[] expects 0 rows and is not
      listed. Internal.
    group: warehouse_internal
    access: private

  - name: int_source_key_presence
    description: >
      One row per consumed source column: whether its key is still in the raw
      JSON of its endpoint's latest admitted live run with payload files, as
      record and missing counts (#114). Read once per build so both
      consumed_keys_present tests on each payload source read this table, not
      the raw objects. Internal.
    group: warehouse_internal
    access: private

  - name: int_endpoint_freshness
    description: >
      One row per live endpoint: its newest admitted capture's received_at,
      that capture's age in hours, and freshness_status (ok, warn over 6h,
      error over 18h, exempt for element-summary) (#103, #88 E2). The
      scheduled build's input guard, which replaces `dbt source freshness`.
      A view, so the age is taken when it is read. Internal.
    group: warehouse_internal
    access: private
    columns:
      - name: endpoint
        data_tests:
          - unique:
              config:
                tags: [integration]
                meta:
                  covers: "#103 AC4"
          - accepted_values:
              arguments:
                values: ['bootstrap-static', 'fixtures', 'event-status', 'element-summary']
              config:
                tags: [integration]
                meta:
                  covers: "#103 AC4"

  - name: int_capture_admission
    description: >
      One row per indexed capture: whether it is admitted, and if not, why
      (#97, #87 D1 and D4-D6). Admitted means its run is finalized, its run
      is production, and the capture is usable and has a season. Production is
      the manifest's own `origin` from contract 2.2.0 (ci on refs/heads/main),
      and seed_run_origin before it (ci or history_port). A failed
      revalidation is admitted but flagged. Internal.
    group: warehouse_internal
    access: private
    columns:
      - name: capture_key
        data_tests:
          - unique:
              config:
                tags: [integration]
                meta:
                  covers: "#97 AC5"
          - not_null:
              config:
                tags: [integration]
                meta:
                  covers: "#97 AC5"
      - name: unadmitted_reason
        data_tests:
          - accepted_values:
              arguments:
                values: ["run_not_finalized", "origin_unknown", "not_production", "unusable", "null_season"]
              config:
                tags: [integration]
                meta:
                  covers: "#97 AC5"

  - name: int_manager_gameweek_status
    description: >
      The audit grid (#216 D1, D5): one row per panel manager per marked
      gameweek, with the manager-gameweek status (GLOSSARY.md) and, when
      captured, the winning capture (latest observed_at, run_id breaking a
      tie). Internal.
    group: warehouse_internal
    access: private
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, entry_id, gameweek]
          config:
            tags: [unit]
            meta:
              covers: "#216 AC1"
    columns:
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["not_yet_joined", "captured", "missing_after_join"]
              config:
                tags: [unit]
                meta:
                  covers: "#216 AC1"

  - name: int_manager_gameweek_points
    description: >
      FPL's own points total for each captured manager-gameweek beside the
      total rebuilt from the picks: the sum of multiplier x the player's
      fct_player_gameweek points (#216 D7). Test-only; not served (D9).
    group: warehouse_internal
    access: private
