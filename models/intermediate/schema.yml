version: 2

models:
  - name: int_player_gameweek_spine
    description: >
      Complete player x gameweek grid, stamped with the season var. Exists so
      fct_player_gameweek has a row for every gameweek a player should have,
      including blanks. Internal: not part of the served contract.
    group: warehouse_internal
    access: private

  - name: int_round_ratification
    description: >
      One row per round carrying FPL's authoritative points-finality flag,
      rolled up from stg_event_status across match dates and across every
      capture ever taken. The source of truth for is_ratified in both served
      models. Internal: not part of the served contract.
    group: warehouse_internal
    access: private
