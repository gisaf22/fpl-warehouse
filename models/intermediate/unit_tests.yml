version: 2

# dbt unit tests for the intermediate layer. Each carries exactly one tier tag,
# like every other test, and a `covers` meta entry naming the board item and
# acceptance criterion it pins.

unit_tests:

  # --- int_gameweek_status: the two-level rollup (#45) ---------------------
  # See the model header and CLAUDE.md, "Gameweek ratification".

  - name: gameweek_with_one_provisional_date_in_a_capture_is_not_ratified
    description: >
      Within one capture a gameweek is ratified only when every dated entry is.
      One ratified date alongside one provisional date leaves the gameweek
      unratified.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC2"
    given:
      - input: ref('stg_gameweek_status')
        rows:
          - {season: "2026-27", gameweek: 4, run_id: "20260914T190000Z-aaaa", match_date: "2026-09-12", points: "r", bonus_added: true}
          - {season: "2026-27", gameweek: 4, run_id: "20260914T190000Z-aaaa", match_date: "2026-09-13", points: "p", bonus_added: false}
    expect:
      rows:
        - {season: "2026-27", gameweek: 4, is_ratified: false}

  - name: gameweek_ratified_earlier_and_omitted_later_stays_ratified
    description: >
      Across captures a gameweek is ratified if any capture ever said so. A later
      capture that no longer lists the gameweek (it rolled out of the window) does
      not undo that.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC3"
    given:
      - input: ref('stg_gameweek_status')
        rows:
          - {season: "2026-27", gameweek: 4, run_id: "20260915T190000Z-aaaa", match_date: "2026-09-13", points: "r", bonus_added: true}
          - {season: "2026-27", gameweek: 5, run_id: "20260919T190000Z-bbbb", match_date: "2026-09-20", points: "p", bonus_added: false}
    expect:
      rows:
        - {season: "2026-27", gameweek: 4, is_ratified: true}
        - {season: "2026-27", gameweek: 5, is_ratified: false}

  - name: gameweek_ratified_earlier_and_provisional_later_stays_ratified
    description: >
      Ratification is monotonic: once any capture reads the gameweek ratified, a
      later capture reading it provisional does not flip it back.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC3"
    given:
      - input: ref('stg_gameweek_status')
        rows:
          - {season: "2026-27", gameweek: 4, run_id: "20260915T190000Z-aaaa", match_date: "2026-09-13", points: "r", bonus_added: true}
          - {season: "2026-27", gameweek: 4, run_id: "20260916T070000Z-bbbb", match_date: "2026-09-13", points: "p", bonus_added: false}
    expect:
      rows:
        - {season: "2026-27", gameweek: 4, is_ratified: true}

  - name: gameweek_never_ratified_reads_false_not_null
    description: >
      A gameweek no capture ever ratified reads false, never null, so consumers
      can filter on the boolean directly.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC4"
    given:
      - input: ref('stg_gameweek_status')
        rows:
          - {season: "2026-27", gameweek: 5, run_id: "20260919T190000Z-aaaa", match_date: "2026-09-20", points: "p", bonus_added: false}
          - {season: "2026-27", gameweek: 5, run_id: "20260920T190000Z-bbbb", match_date: "2026-09-20", points: "p", bonus_added: false}
    expect:
      rows:
        - {season: "2026-27", gameweek: 5, is_ratified: false}

  - name: gameweek_never_ratified_with_unknown_bonus_reads_false_not_null
    description: >
      Same as above when bonus_added is missing from the payload: the
      per-capture verdict is then null, and the gameweek must still read false.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC4"
    given:
      - input: ref('stg_gameweek_status')
        rows:
          - {season: "2026-27", gameweek: 5, run_id: "20260919T190000Z-aaaa", match_date: "2026-09-20", points: "r", bonus_added: null}
    expect:
      rows:
        - {season: "2026-27", gameweek: 5, is_ratified: false}

  - name: empty_points_status_alongside_provisional_is_not_ratified
    description: >
      An empty-string points status is an in-progress state, seen alongside
      "p" in the same capture. The gameweek is not ratified.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC5"
    given:
      - input: ref('stg_gameweek_status')
        rows:
          - {season: "2026-27", gameweek: 4, run_id: "20260914T070000Z-aaaa", match_date: "2026-09-12", points: "", bonus_added: false}
          - {season: "2026-27", gameweek: 4, run_id: "20260914T070000Z-aaaa", match_date: "2026-09-13", points: "p", bonus_added: false}
    expect:
      rows:
        - {season: "2026-27", gameweek: 4, is_ratified: false}

  - name: empty_points_status_is_not_ratified_even_with_bonus_added
    description: >
      Isolates the empty string itself: a gameweek whose only date has points ""
      is not ratified, even if bonus_added reads true.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC5"
    given:
      - input: ref('stg_gameweek_status')
        rows:
          - {season: "2026-27", gameweek: 4, run_id: "20260914T070000Z-aaaa", match_date: "2026-09-12", points: "", bonus_added: true}
    expect:
      rows:
        - {season: "2026-27", gameweek: 4, is_ratified: false}

  # --- int_player_season: one row per player per season (#69) ------------------
  # The fixture tree has no rename and no mid-season arrival, so these AC1
  # examples are pinned here against mocked captures. AC4's cross-season cases
  # also exist in the fixture tree (fpl_ids 4, 166 and 426 in both seasons);
  # these make them explicit.

  - name: player_in_many_captures_has_one_roster_row
    description: A player seen in three captures of one season gets one row.
    model: int_player_season
    config:
      tags: [unit]
      meta:
        covers: "#69 AC1"
    given:
      - input: ref('stg_player')
        rows:
          - {season: "2026-27", run_id: "20260829T190000Z-aaaa", extracted_at: "2026-08-29 19:00:00", observed_at: "2026-08-29 19:00:00", fpl_id: 1, player_code: 100, web_name: "Saka"}
          - {season: "2026-27", run_id: "20260830T190000Z-bbbb", extracted_at: "2026-08-30 19:00:00", observed_at: "2026-08-30 19:00:00", fpl_id: 1, player_code: 100, web_name: "Saka"}
          - {season: "2026-27", run_id: "20260831T190000Z-cccc", extracted_at: "2026-08-31 19:00:00", observed_at: "2026-08-31 19:00:00", fpl_id: 1, player_code: 100, web_name: "Saka"}
    expect:
      rows:
        - {season: "2026-27", fpl_id: 1, player_code: 100, web_name: "Saka"}

  - name: mid_season_arrival_has_a_roster_row
    description: >
      A player first seen in a later capture still gets one row for the season.
    model: int_player_season
    config:
      tags: [unit]
      meta:
        covers: "#69 AC1"
    given:
      - input: ref('stg_player')
        rows:
          - {season: "2026-27", run_id: "20260829T190000Z-aaaa", extracted_at: "2026-08-29 19:00:00", observed_at: "2026-08-29 19:00:00", fpl_id: 1, player_code: 100, web_name: "Saka"}
          - {season: "2026-27", run_id: "20260905T190000Z-bbbb", extracted_at: "2026-09-05 19:00:00", observed_at: "2026-09-05 19:00:00", fpl_id: 1, player_code: 100, web_name: "Saka"}
          - {season: "2026-27", run_id: "20260905T190000Z-bbbb", extracted_at: "2026-09-05 19:00:00", observed_at: "2026-09-05 19:00:00", fpl_id: 700, player_code: 777, web_name: "Newcomer"}
    expect:
      rows:
        - {season: "2026-27", fpl_id: 1, player_code: 100, web_name: "Saka"}
        - {season: "2026-27", fpl_id: 700, player_code: 777, web_name: "Newcomer"}

  - name: renamed_player_has_one_row_with_the_newest_spelling
    description: >
      A player FPL renames between captures (observed live on fpl_id 551,
      "Angulo" then "N.Angulo") gets one row carrying the newest spelling.
    model: int_player_season
    config:
      tags: [unit]
      meta:
        covers: "#69 AC1"
    given:
      - input: ref('stg_player')
        rows:
          - {season: "2026-27", run_id: "20260829T190000Z-aaaa", extracted_at: "2026-08-29 19:00:00", observed_at: "2026-08-29 19:00:00", fpl_id: 551, player_code: 555, web_name: "Angulo"}
          - {season: "2026-27", run_id: "20260905T190000Z-bbbb", extracted_at: "2026-09-05 19:00:00", observed_at: "2026-09-05 19:00:00", fpl_id: 551, player_code: 555, web_name: "N.Angulo"}
    expect:
      rows:
        - {season: "2026-27", fpl_id: 551, player_code: 555, web_name: "N.Angulo"}

  - name: same_fpl_id_in_two_seasons_is_two_rows_with_their_own_values
    description: >
      fpl_id is reassigned each season, so fpl_id 4 in 2025-26 and 2026-27 is
      two different people: two rows, each with only its own season's values.
    model: int_player_season
    config:
      tags: [unit]
      meta:
        covers: "#69 AC4"
    given:
      - input: ref('stg_player')
        rows:
          - {season: "2025-26", run_id: "20260526T034626Z-2a6b73", extracted_at: "2026-05-26 03:46:26", observed_at: "2026-05-26 03:46:26", fpl_id: 4, player_code: 551221, web_name: "Setford"}
          - {season: "2026-27", run_id: "20260829T190000Z-aaaa", extracted_at: "2026-08-29 19:00:00", observed_at: "2026-08-29 19:00:00", fpl_id: 4, player_code: 226597, web_name: "Gabriel"}
    expect:
      rows:
        - {season: "2025-26", fpl_id: 4, player_code: 551221, web_name: "Setford"}
        - {season: "2026-27", fpl_id: 4, player_code: 226597, web_name: "Gabriel"}

  - name: same_player_code_under_two_fpl_ids_across_seasons_is_two_rows
    description: >
      player_code is carried, never a key: one person under fpl_id 449 in
      2025-26 and fpl_id 426 in 2026-27 stays two rows, never merged.
    model: int_player_season
    config:
      tags: [unit]
      meta:
        covers: "#69 AC4"
    given:
      - input: ref('stg_player')
        rows:
          - {season: "2025-26", run_id: "20260526T034626Z-2a6b73", extracted_at: "2026-05-26 03:46:26", observed_at: "2026-05-26 03:46:26", fpl_id: 449, player_code: 141746, web_name: "B.Fernandes"}
          - {season: "2026-27", run_id: "20260829T190000Z-aaaa", extracted_at: "2026-08-29 19:00:00", observed_at: "2026-08-29 19:00:00", fpl_id: 426, player_code: 141746, web_name: "B.Fernandes"}
    expect:
      rows:
        - {season: "2025-26", fpl_id: 449, player_code: 141746, web_name: "B.Fernandes"}
        - {season: "2026-27", fpl_id: 426, player_code: 141746, web_name: "B.Fernandes"}

  # --- int_capture_admission: which captures are admitted (#97) -------------
  # See the model header and #87 decisions D1-D6.

  - name: production_is_ci_on_main_from_the_manifest_origin
    description: >
      From contract 2.2.0 a run is production only when its manifest says ci on
      refs/heads/main. A local run, or ci on another ref, is not_production.
    model: int_capture_admission
    config:
      tags: [unit]
      meta:
        covers: "#97 AC1"
    given:
      - input: ref('base_capture_index')
        rows:
          - {capture_key: "k-main", run_id: "20261003T052050Z-aaaaaa", season: "2026-27", usable: true, shape_ok: true, shape_source: "sidecar"}
          - {capture_key: "k-local", run_id: "20261003T060000Z-bbbbbb", season: "2026-27", usable: true, shape_ok: true, shape_source: "sidecar"}
          - {capture_key: "k-branch", run_id: "20261003T070000Z-cccccc", season: "2026-27", usable: true, shape_ok: true, shape_source: "sidecar"}
      - input: ref('stg_run')
        rows:
          - {run_id: "20261003T052050Z-aaaaaa", origin_kind: "ci", origin_ref: "refs/heads/main"}
          - {run_id: "20261003T060000Z-bbbbbb", origin_kind: "local", origin_ref: null}
          - {run_id: "20261003T070000Z-cccccc", origin_kind: "ci", origin_ref: "refs/heads/feat/x"}
      - input: ref('seed_run_origin')
        rows: []
    expect:
      rows:
        - {capture_key: "k-main", admitted: true, flagged_revalidation: false, unadmitted_reason: null}
        - {capture_key: "k-local", admitted: false, flagged_revalidation: false, unadmitted_reason: "not_production"}
        - {capture_key: "k-branch", admitted: false, flagged_revalidation: false, unadmitted_reason: "not_production"}

  - name: unusable_unfinalized_and_seasonless_captures_are_not_admitted
    description: >
      A usable = false capture, a capture whose run has no finalized manifest,
      and a capture with no season are each not admitted, with their own reason.
      All three runs are ci in the seed, so production is not what excludes them.
    model: int_capture_admission
    config:
      tags: [unit]
      meta:
        covers: "#97 AC3"
    given:
      - input: ref('base_capture_index')
        rows:
          - {capture_key: "k-unusable", run_id: "20260901T071823Z-aaaaaa", season: "2026-27", usable: false, shape_ok: true, shape_source: "sidecar"}
          - {capture_key: "k-unfinalized", run_id: "20260902T071823Z-bbbbbb", season: "2026-27", usable: true, shape_ok: true, shape_source: "sidecar"}
          - {capture_key: "k-seasonless", run_id: "20260903T071823Z-cccccc", season: null, usable: true, shape_ok: true, shape_source: "sidecar"}
      - input: ref('stg_run')
        rows:
          - {run_id: "20260901T071823Z-aaaaaa", origin_kind: null, origin_ref: null}
          - {run_id: "20260903T071823Z-cccccc", origin_kind: null, origin_ref: null}
      - input: ref('seed_run_origin')
        rows:
          - {run_id: "20260901T071823Z-aaaaaa", origin_kind: "ci"}
          - {run_id: "20260902T071823Z-bbbbbb", origin_kind: "ci"}
          - {run_id: "20260903T071823Z-cccccc", origin_kind: "ci"}
    expect:
      rows:
        - {capture_key: "k-unusable", admitted: false, flagged_revalidation: false, unadmitted_reason: "unusable"}
        - {capture_key: "k-unfinalized", admitted: false, flagged_revalidation: false, unadmitted_reason: "run_not_finalized"}
        - {capture_key: "k-seasonless", admitted: false, flagged_revalidation: false, unadmitted_reason: "null_season"}

  - name: a_failed_revalidation_is_admitted_and_flagged
    description: >
      shape_source = revalidated with shape_ok = false on an otherwise admissible
      capture is admitted with flagged_revalidation = true. A passing
      revalidation, and a sidecar verdict of shape_ok = false, are not flagged.
    model: int_capture_admission
    config:
      tags: [unit]
      meta:
        covers: "#97 AC4"
    given:
      - input: ref('base_capture_index')
        rows:
          - {capture_key: "k-failed", run_id: "20260526T034626Z-2a6b73", season: "2025-26", usable: true, shape_ok: false, shape_source: "revalidated"}
          - {capture_key: "k-passed", run_id: "20260526T034626Z-2a6b73", season: "2025-26", usable: true, shape_ok: true, shape_source: "revalidated"}
          - {capture_key: "k-sidecar", run_id: "20260526T034626Z-2a6b73", season: "2025-26", usable: true, shape_ok: false, shape_source: "sidecar"}
      - input: ref('stg_run')
        rows: []
      - input: ref('seed_run_origin')
        rows:
          - {run_id: "20260526T034626Z-2a6b73", origin_kind: "history_port"}
    expect:
      rows:
        - {capture_key: "k-failed", admitted: true, flagged_revalidation: true, unadmitted_reason: null}
        - {capture_key: "k-passed", admitted: true, flagged_revalidation: false, unadmitted_reason: null}
        - {capture_key: "k-sidecar", admitted: true, flagged_revalidation: false, unadmitted_reason: null}

  # --- int_endpoint_freshness: per-endpoint age of admitted captures (#103) --
  # as_of is pinned through the freshness_as_of var so ages are exact.

  - name: endpoint_freshness_warns_over_6h_errors_over_18h_and_exempts_element_summary
    description: >
      Each live endpoint's newest admitted capture sets its age. Over 6h warns,
      over 18h errors, and element-summary is exempt however old it is.
    model: int_endpoint_freshness
    config:
      tags: [unit]
      meta:
        covers: "#103 AC1"
    overrides:
      vars:
        freshness_as_of: "2026-10-04 12:00:00"
    given:
      - input: ref('base_capture_index')
        rows:
          - {capture_key: "bs-old", endpoint: "bootstrap-static", scope: null, received_at: "2026-10-03 12:00:00"}
          - {capture_key: "bs-new", endpoint: "bootstrap-static", scope: null, received_at: "2026-10-04 07:00:00"}
          - {capture_key: "fx", endpoint: "fixtures", scope: null, received_at: "2026-10-04 05:00:00"}
          - {capture_key: "es", endpoint: "event-status", scope: null, received_at: "2026-10-03 17:00:00"}
          - {capture_key: "el", endpoint: "element-summary/166", scope: null, received_at: "2026-09-14 12:00:00"}
      - input: ref('int_capture_admission')
        rows:
          - {capture_key: "bs-old", admitted: true}
          - {capture_key: "bs-new", admitted: true}
          - {capture_key: "fx", admitted: true}
          - {capture_key: "es", admitted: true}
          - {capture_key: "el", admitted: true}
    expect:
      rows:
        - {endpoint: "bootstrap-static", newest_received_at: "2026-10-04 07:00:00", age_hours: 5.0, freshness_status: "ok"}
        - {endpoint: "fixtures", newest_received_at: "2026-10-04 05:00:00", age_hours: 7.0, freshness_status: "warn"}
        - {endpoint: "event-status", newest_received_at: "2026-10-03 17:00:00", age_hours: 19.0, freshness_status: "error"}
        - {endpoint: "element-summary", newest_received_at: "2026-09-14 12:00:00", age_hours: 480.0, freshness_status: "exempt"}

  - name: endpoint_freshness_thresholds_are_strictly_over
    description: >
      Exactly 6h is still ok and exactly 18h still only warns; one second past
      18h errors.
    model: int_endpoint_freshness
    config:
      tags: [unit]
      meta:
        covers: "#103 AC1"
    overrides:
      vars:
        freshness_as_of: "2026-10-04 12:00:00"
    given:
      - input: ref('base_capture_index')
        rows:
          - {capture_key: "bs", endpoint: "bootstrap-static", scope: null, received_at: "2026-10-04 06:00:00"}
          - {capture_key: "fx", endpoint: "fixtures", scope: null, received_at: "2026-10-03 18:00:00"}
          - {capture_key: "es", endpoint: "event-status", scope: null, received_at: "2026-10-03 17:59:59"}
          - {capture_key: "el", endpoint: "element-summary/4", scope: null, received_at: "2026-10-04 11:00:00"}
      - input: ref('int_capture_admission')
        rows:
          - {capture_key: "bs", admitted: true}
          - {capture_key: "fx", admitted: true}
          - {capture_key: "es", admitted: true}
          - {capture_key: "el", admitted: true}
    expect:
      rows:
        - {endpoint: "bootstrap-static", newest_received_at: "2026-10-04 06:00:00", age_hours: 6.0, freshness_status: "ok"}
        - {endpoint: "fixtures", newest_received_at: "2026-10-03 18:00:00", age_hours: 18.0, freshness_status: "warn"}
        - {endpoint: "event-status", newest_received_at: "2026-10-03 17:59:59", age_hours: 18.0, freshness_status: "error"}
        - {endpoint: "element-summary", newest_received_at: "2026-10-04 11:00:00", age_hours: 1.0, freshness_status: "exempt"}

  - name: endpoint_freshness_ignores_an_unadmitted_newer_capture
    description: >
      A local (not_production) capture newer than every admitted one does not
      make its endpoint fresh: only admitted captures count.
    model: int_endpoint_freshness
    config:
      tags: [unit]
      meta:
        covers: "#103 AC2"
    overrides:
      vars:
        freshness_as_of: "2026-10-04 12:00:00"
    given:
      - input: ref('base_capture_index')
        rows:
          - {capture_key: "es-ci", endpoint: "event-status", scope: null, received_at: "2026-10-03 12:00:00"}
          - {capture_key: "es-local", endpoint: "event-status", scope: null, received_at: "2026-10-04 11:00:00"}
          - {capture_key: "bs", endpoint: "bootstrap-static", scope: null, received_at: "2026-10-04 11:00:00"}
          - {capture_key: "fx", endpoint: "fixtures", scope: null, received_at: "2026-10-04 11:00:00"}
          - {capture_key: "el", endpoint: "element-summary/4", scope: null, received_at: "2026-10-04 11:00:00"}
      - input: ref('int_capture_admission')
        rows:
          - {capture_key: "es-ci", admitted: true}
          - {capture_key: "es-local", admitted: false}
          - {capture_key: "bs", admitted: true}
          - {capture_key: "fx", admitted: true}
          - {capture_key: "el", admitted: true}
    expect:
      rows:
        - {endpoint: "bootstrap-static", newest_received_at: "2026-10-04 11:00:00", age_hours: 1.0, freshness_status: "ok"}
        - {endpoint: "fixtures", newest_received_at: "2026-10-04 11:00:00", age_hours: 1.0, freshness_status: "ok"}
        - {endpoint: "event-status", newest_received_at: "2026-10-03 12:00:00", age_hours: 24.0, freshness_status: "error"}
        - {endpoint: "element-summary", newest_received_at: "2026-10-04 11:00:00", age_hours: 1.0, freshness_status: "exempt"}

  - name: endpoint_with_no_admitted_live_capture_still_has_a_row_and_errors
    description: >
      fixtures has only an unadmitted capture and event-status none at all.
      Both keep their row, with no received_at or age, and read error.
    model: int_endpoint_freshness
    config:
      tags: [unit]
      meta:
        covers: "#103 AC4"
    overrides:
      vars:
        freshness_as_of: "2026-10-04 12:00:00"
    given:
      - input: ref('base_capture_index')
        rows:
          - {capture_key: "bs", endpoint: "bootstrap-static", scope: null, received_at: "2026-10-04 11:00:00"}
          - {capture_key: "fx-local", endpoint: "fixtures", scope: null, received_at: "2026-10-04 11:00:00"}
          - {capture_key: "el", endpoint: "element-summary/4", scope: null, received_at: "2026-10-04 11:00:00"}
      - input: ref('int_capture_admission')
        rows:
          - {capture_key: "bs", admitted: true}
          - {capture_key: "fx-local", admitted: false}
          - {capture_key: "el", admitted: true}
    expect:
      rows:
        - {endpoint: "bootstrap-static", newest_received_at: "2026-10-04 11:00:00", age_hours: 1.0, freshness_status: "ok"}
        - {endpoint: "fixtures", newest_received_at: null, age_hours: null, freshness_status: "error"}
        - {endpoint: "event-status", newest_received_at: null, age_hours: null, freshness_status: "error"}
        - {endpoint: "element-summary", newest_received_at: "2026-10-04 11:00:00", age_hours: 1.0, freshness_status: "exempt"}

  # --- int_player_fixture_history_mismatch: staged rows vs history[] (#175) --
  # Synthetic: a raw payload cannot produce a drop, because the entry count and
  # the staged rows come from the same payload. Only staging code loses rows.

  - name: capture_with_entries_and_no_staged_rows_is_listed
    description: >
      A full drop: a capture whose history[] has 3 entries and no
      stg_player_fixture row is listed with expected 3 and staged 0. A matching
      capture and an empty history[] staging 0 rows are not listed.
    model: int_player_fixture_history_mismatch
    config:
      tags: [unit]
      meta:
        covers: "#175 AC2c"
    given:
      - input: ref('stg_player_history_capture')
        rows:
          - {capture_key: "dropped", season: "2026-27", run_id: "20260914T190000Z-aaaa", history_count: 3}
          - {capture_key: "matched", season: "2026-27", run_id: "20260914T190000Z-aaaa", history_count: 2}
          - {capture_key: "empty", season: "2026-27", run_id: "20260914T190000Z-aaaa", history_count: 0}
      - input: ref('stg_player_fixture')
        rows:
          - {capture_key: "matched"}
          - {capture_key: "matched"}
    expect:
      rows:
        - {capture_key: "dropped", season: "2026-27", run_id: "20260914T190000Z-aaaa", expected_rows: 3, staged_rows: 0}

  - name: capture_with_fewer_staged_rows_than_entries_is_listed
    description: >
      A partial drop: a capture whose history[] has 3 entries and 2
      stg_player_fixture rows is listed with expected 3 and staged 2. #167's
      admitted-vs-staged guard cannot see this, because the capture has rows.
    model: int_player_fixture_history_mismatch
    config:
      tags: [unit]
      meta:
        covers: "#175 AC2d"
    given:
      - input: ref('stg_player_history_capture')
        rows:
          - {capture_key: "partial", season: "2026-27", run_id: "20260914T190000Z-aaaa", history_count: 3}
      - input: ref('stg_player_fixture')
        rows:
          - {capture_key: "partial"}
          - {capture_key: "partial"}
    expect:
      rows:
        - {capture_key: "partial", season: "2026-27", run_id: "20260914T190000Z-aaaa", expected_rows: 3, staged_rows: 2}

  # --- int_manager_gameweek_status: the audit grid (#216 D1, D4, D5) --------
  # Rows: every panel manager x every marked gameweek of the season. Status from
  # the join week, an admitted picks capture, and the marker.

  - name: manager_gameweek_status_follows_join_week_capture_and_marker
    description: >
      Manager 10187394 joined in gameweek 3, so gameweeks 1 and 2 are
      not_yet_joined though ingest stored a pre-join 404 for them (never
      staged). Manager 8450051 joined in gameweek 1 and has no capture for
      gameweek 2: missing_after_join. Gameweek 4 has captures but no marker, so
      it has no row at all.
    model: int_manager_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#216 AC1"
    given:
      - input: ref('dim_manager_panel')
        rows:
          - {season: "2026-27", entry_id: 10187394, cohort: random, first_active_gw: 3}
          - {season: "2026-27", entry_id: 8450051, cohort: self, first_active_gw: 1}
      - input: ref('stg_entry_picks_settlement')
        rows:
          - {season: "2026-27", gameweek: 1, entries: 2}
          - {season: "2026-27", gameweek: 2, entries: 2}
          - {season: "2026-27", gameweek: 3, entries: 2}
      - input: ref('stg_entry_picks_capture')
        rows:
          - {capture_key: "k-8450051-1", season: "2026-27", entry_id: 8450051, gameweek: 1, observed_at: "2026-10-21 05:58:00", run_id: "20261021T055756Z-5b39a4"}
          - {capture_key: "k-8450051-3", season: "2026-27", entry_id: 8450051, gameweek: 3, observed_at: "2026-10-21 17:35:00", run_id: "20261021T173314Z-d6b07d"}
          - {capture_key: "k-10187394-3", season: "2026-27", entry_id: 10187394, gameweek: 3, observed_at: "2026-10-21 17:35:00", run_id: "20261021T173314Z-d6b07d"}
          - {capture_key: "k-10187394-4", season: "2026-27", entry_id: 10187394, gameweek: 4, observed_at: "2026-10-21 17:38:00", run_id: "20261021T173314Z-d6b07d"}
    expect:
      rows:
        - {season: "2026-27", entry_id: 10187394, gameweek: 1, first_active_gw: 3, capture_key: null, status: not_yet_joined}
        - {season: "2026-27", entry_id: 10187394, gameweek: 2, first_active_gw: 3, capture_key: null, status: not_yet_joined}
        - {season: "2026-27", entry_id: 10187394, gameweek: 3, first_active_gw: 3, capture_key: "k-10187394-3", status: captured}
        - {season: "2026-27", entry_id: 8450051, gameweek: 1, first_active_gw: 1, capture_key: "k-8450051-1", status: captured}
        - {season: "2026-27", entry_id: 8450051, gameweek: 2, first_active_gw: 1, capture_key: null, status: missing_after_join}
        - {season: "2026-27", entry_id: 8450051, gameweek: 3, first_active_gw: 1, capture_key: "k-8450051-3", status: captured}

  - name: manager_gameweek_status_takes_the_latest_capture
    description: >
      Two admitted captures of the same manager-gameweek: the later observed_at
      wins, and run_id breaks a tie, as for element-summary.
    model: int_manager_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#216 AC1"
    given:
      - input: ref('dim_manager_panel')
        rows:
          - {season: "2026-27", entry_id: 8450051, cohort: self, first_active_gw: 1}
      - input: ref('stg_entry_picks_settlement')
        rows:
          - {season: "2026-27", gameweek: 1, entries: 1}
          - {season: "2026-27", gameweek: 2, entries: 1}
      - input: ref('stg_entry_picks_capture')
        rows:
          - {capture_key: "older", season: "2026-27", entry_id: 8450051, gameweek: 1, observed_at: "2026-10-21 05:58:00", run_id: "20261021T055756Z-5b39a4"}
          - {capture_key: "newer", season: "2026-27", entry_id: 8450051, gameweek: 1, observed_at: "2026-10-22 05:58:00", run_id: "20261022T055756Z-aaaaaa"}
          - {capture_key: "tie-a", season: "2026-27", entry_id: 8450051, gameweek: 2, observed_at: "2026-10-21 06:00:00", run_id: "20261021T055756Z-5b39a4"}
          - {capture_key: "tie-b", season: "2026-27", entry_id: 8450051, gameweek: 2, observed_at: "2026-10-21 06:00:00", run_id: "20261021T173314Z-d6b07d"}
    expect:
      rows:
        - {season: "2026-27", entry_id: 8450051, gameweek: 1, capture_key: "newer", status: captured}
        - {season: "2026-27", entry_id: 8450051, gameweek: 2, capture_key: "tie-b", status: captured}

