version: 2

# dbt unit tests for the intermediate layer. Each carries exactly one tier tag,
# like every other test, and a `covers` meta entry naming the board item and
# acceptance criterion it pins.

unit_tests:

  # --- int_gameweek_status: the two-level rollup (#45) ---------------------
  # See the model header and CLAUDE.md, "Gameweek ratification".

  - name: gameweek_with_one_provisional_date_in_a_capture_is_not_ratified
    description: >
      Within one capture a gameweek is ratified only when every dated entry is.
      One ratified date alongside one provisional date leaves the gameweek
      unratified.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC2"
    given:
      - input: ref('stg_event_status')
        rows:
          - {season: "2026-27", round: 4, run_id: "20260914T190000Z-aaaa", match_date: "2026-09-12", points: "r", bonus_added: true}
          - {season: "2026-27", round: 4, run_id: "20260914T190000Z-aaaa", match_date: "2026-09-13", points: "p", bonus_added: false}
    expect:
      rows:
        - {season: "2026-27", gameweek: 4, is_ratified: false}

  - name: gameweek_ratified_earlier_and_omitted_later_stays_ratified
    description: >
      Across captures a gameweek is ratified if any capture ever said so. A later
      capture that no longer lists the gameweek (it rolled out of the window) does
      not undo that.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC3"
    given:
      - input: ref('stg_event_status')
        rows:
          - {season: "2026-27", round: 4, run_id: "20260915T190000Z-aaaa", match_date: "2026-09-13", points: "r", bonus_added: true}
          - {season: "2026-27", round: 5, run_id: "20260919T190000Z-bbbb", match_date: "2026-09-20", points: "p", bonus_added: false}
    expect:
      rows:
        - {season: "2026-27", gameweek: 4, is_ratified: true}
        - {season: "2026-27", gameweek: 5, is_ratified: false}

  - name: gameweek_ratified_earlier_and_provisional_later_stays_ratified
    description: >
      Ratification is monotonic: once any capture reads the gameweek ratified, a
      later capture reading it provisional does not flip it back.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC3"
    given:
      - input: ref('stg_event_status')
        rows:
          - {season: "2026-27", round: 4, run_id: "20260915T190000Z-aaaa", match_date: "2026-09-13", points: "r", bonus_added: true}
          - {season: "2026-27", round: 4, run_id: "20260916T070000Z-bbbb", match_date: "2026-09-13", points: "p", bonus_added: false}
    expect:
      rows:
        - {season: "2026-27", gameweek: 4, is_ratified: true}

  - name: gameweek_never_ratified_reads_false_not_null
    description: >
      A gameweek no capture ever ratified reads false, never null, so consumers
      can filter on the boolean directly.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC4"
    given:
      - input: ref('stg_event_status')
        rows:
          - {season: "2026-27", round: 5, run_id: "20260919T190000Z-aaaa", match_date: "2026-09-20", points: "p", bonus_added: false}
          - {season: "2026-27", round: 5, run_id: "20260920T190000Z-bbbb", match_date: "2026-09-20", points: "p", bonus_added: false}
    expect:
      rows:
        - {season: "2026-27", gameweek: 5, is_ratified: false}

  - name: gameweek_never_ratified_with_unknown_bonus_reads_false_not_null
    description: >
      Same as above when bonus_added is missing from the payload: the
      per-capture verdict is then null, and the gameweek must still read false.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC4"
    given:
      - input: ref('stg_event_status')
        rows:
          - {season: "2026-27", round: 5, run_id: "20260919T190000Z-aaaa", match_date: "2026-09-20", points: "r", bonus_added: null}
    expect:
      rows:
        - {season: "2026-27", gameweek: 5, is_ratified: false}

  - name: empty_points_status_alongside_provisional_is_not_ratified
    description: >
      An empty-string points status is an in-progress state, seen alongside
      "p" in the same capture. The gameweek is not ratified.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC5"
    given:
      - input: ref('stg_event_status')
        rows:
          - {season: "2026-27", round: 4, run_id: "20260914T070000Z-aaaa", match_date: "2026-09-12", points: "", bonus_added: false}
          - {season: "2026-27", round: 4, run_id: "20260914T070000Z-aaaa", match_date: "2026-09-13", points: "p", bonus_added: false}
    expect:
      rows:
        - {season: "2026-27", gameweek: 4, is_ratified: false}

  - name: empty_points_status_is_not_ratified_even_with_bonus_added
    description: >
      Isolates the empty string itself: a gameweek whose only date has points ""
      is not ratified, even if bonus_added reads true.
    model: int_gameweek_status
    config:
      tags: [unit]
      meta:
        covers: "#45 AC5"
    given:
      - input: ref('stg_event_status')
        rows:
          - {season: "2026-27", round: 4, run_id: "20260914T070000Z-aaaa", match_date: "2026-09-12", points: "", bonus_added: true}
    expect:
      rows:
        - {season: "2026-27", gameweek: 4, is_ratified: false}

  # --- int_player_season: one row per player per season (#69) ------------------
  # The fixture tree has no rename and no mid-season arrival, so these AC1
  # examples are pinned here against mocked captures. AC4's cross-season cases
  # also exist in the fixture tree (fpl_ids 4, 166 and 426 in both seasons);
  # these make them explicit.

  - name: player_in_many_captures_has_one_roster_row
    description: A player seen in three captures of one season gets one row.
    model: int_player_season
    config:
      tags: [unit]
      meta:
        covers: "#69 AC1"
    given:
      - input: ref('stg_player')
        rows:
          - {season: "2026-27", run_id: "20260829T190000Z-aaaa", extracted_at: "2026-08-29 19:00:00", fpl_id: 1, player_code: 100, web_name: "Saka"}
          - {season: "2026-27", run_id: "20260830T190000Z-bbbb", extracted_at: "2026-08-30 19:00:00", fpl_id: 1, player_code: 100, web_name: "Saka"}
          - {season: "2026-27", run_id: "20260831T190000Z-cccc", extracted_at: "2026-08-31 19:00:00", fpl_id: 1, player_code: 100, web_name: "Saka"}
    expect:
      rows:
        - {season: "2026-27", fpl_id: 1, player_code: 100, web_name: "Saka"}

  - name: mid_season_arrival_has_a_roster_row
    description: >
      A player first seen in a later capture still gets one row for the season.
    model: int_player_season
    config:
      tags: [unit]
      meta:
        covers: "#69 AC1"
    given:
      - input: ref('stg_player')
        rows:
          - {season: "2026-27", run_id: "20260829T190000Z-aaaa", extracted_at: "2026-08-29 19:00:00", fpl_id: 1, player_code: 100, web_name: "Saka"}
          - {season: "2026-27", run_id: "20260905T190000Z-bbbb", extracted_at: "2026-09-05 19:00:00", fpl_id: 1, player_code: 100, web_name: "Saka"}
          - {season: "2026-27", run_id: "20260905T190000Z-bbbb", extracted_at: "2026-09-05 19:00:00", fpl_id: 700, player_code: 777, web_name: "Newcomer"}
    expect:
      rows:
        - {season: "2026-27", fpl_id: 1, player_code: 100, web_name: "Saka"}
        - {season: "2026-27", fpl_id: 700, player_code: 777, web_name: "Newcomer"}

  - name: renamed_player_has_one_row_with_the_newest_spelling
    description: >
      A player FPL renames between captures (observed live on fpl_id 551,
      "Angulo" then "N.Angulo") gets one row carrying the newest spelling.
    model: int_player_season
    config:
      tags: [unit]
      meta:
        covers: "#69 AC1"
    given:
      - input: ref('stg_player')
        rows:
          - {season: "2026-27", run_id: "20260829T190000Z-aaaa", extracted_at: "2026-08-29 19:00:00", fpl_id: 551, player_code: 555, web_name: "Angulo"}
          - {season: "2026-27", run_id: "20260905T190000Z-bbbb", extracted_at: "2026-09-05 19:00:00", fpl_id: 551, player_code: 555, web_name: "N.Angulo"}
    expect:
      rows:
        - {season: "2026-27", fpl_id: 551, player_code: 555, web_name: "N.Angulo"}

  - name: same_fpl_id_in_two_seasons_is_two_rows_with_their_own_values
    description: >
      fpl_id is reassigned each season, so fpl_id 4 in 2025-26 and 2026-27 is
      two different people: two rows, each with only its own season's values.
    model: int_player_season
    config:
      tags: [unit]
      meta:
        covers: "#69 AC4"
    given:
      - input: ref('stg_player')
        rows:
          - {season: "2025-26", run_id: "20260526T034626Z-2a6b73", extracted_at: "2026-05-26 03:46:26", fpl_id: 4, player_code: 551221, web_name: "Setford"}
          - {season: "2026-27", run_id: "20260829T190000Z-aaaa", extracted_at: "2026-08-29 19:00:00", fpl_id: 4, player_code: 226597, web_name: "Gabriel"}
    expect:
      rows:
        - {season: "2025-26", fpl_id: 4, player_code: 551221, web_name: "Setford"}
        - {season: "2026-27", fpl_id: 4, player_code: 226597, web_name: "Gabriel"}

  - name: same_player_code_under_two_fpl_ids_across_seasons_is_two_rows
    description: >
      player_code is carried, never a key: one person under fpl_id 449 in
      2025-26 and fpl_id 426 in 2026-27 stays two rows, never merged.
    model: int_player_season
    config:
      tags: [unit]
      meta:
        covers: "#69 AC4"
    given:
      - input: ref('stg_player')
        rows:
          - {season: "2025-26", run_id: "20260526T034626Z-2a6b73", extracted_at: "2026-05-26 03:46:26", fpl_id: 449, player_code: 141746, web_name: "B.Fernandes"}
          - {season: "2026-27", run_id: "20260829T190000Z-aaaa", extracted_at: "2026-08-29 19:00:00", fpl_id: 426, player_code: 141746, web_name: "B.Fernandes"}
    expect:
      rows:
        - {season: "2025-26", fpl_id: 449, player_code: 141746, web_name: "B.Fernandes"}
        - {season: "2026-27", fpl_id: 426, player_code: 141746, web_name: "B.Fernandes"}
